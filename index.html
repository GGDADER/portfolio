<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#000000">
<title>Portfolio Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,'SF Pro Display','Noto Sans TC',system-ui,sans-serif;background:#000;color:#e6e6e6;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
:root{
  --bg:#000;--surface:#0d0d0d;--surface2:#161616;--border:#222;--border2:#2a2a2a;
  --text:#fff;--muted:#888;--dim:#555;
  --up:#00D26A;--up-soft:rgba(0,210,106,.12);--up-glow:rgba(0,210,106,.25);
  --down:#FF5252;--down-soft:rgba(255,82,82,.12);
  --blue:#4287f5;--purple:#a48bf5;--amber:#fbbf24;
}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:#000}
.hdr{padding:12px 16px;background:rgba(0,0,0,.95);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;z-index:20;backdrop-filter:blur(10px);border-bottom:0.5px solid var(--border)}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.cnt{padding:14px 16px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:10px 20px 14px;background:linear-gradient(to top,#000 60%,transparent);z-index:20}
@supports(padding:env(safe-area-inset-bottom)){.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.hdr{padding-top:calc(12px + env(safe-area-inset-top))}}
.nb{background:0;border:0;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 16px;font-family:inherit;gap:2px}
.nb.on{color:var(--up)}
.fab{width:52px;height:52px;border-radius:50%;background:var(--up);border:0;color:#000;font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 8px 24px var(--up-glow)}
.fab:active{transform:scale(.93)}
.hib{background:transparent;border:0;color:var(--text);width:36px;height:36px;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-family:inherit;transition:background .15s}
.hib:active{background:var(--surface2)}
.brand{display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up-glow)}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-0.2px}
.cd{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.cd-flat{background:var(--surface);border-radius:14px;padding:14px 16px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;outline:0;font-family:inherit;box-sizing:border-box}
.inp:focus{border-color:var(--up)}
.bp{flex:1;padding:13px;border-radius:14px;border:0;background:var(--up);color:#000;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-0.2px}
.bp:active{transform:scale(.98)}
.bp:disabled{opacity:.3}
.bs{flex:1;padding:13px;border-radius:14px;border:1px solid var(--border2);background:0;color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit}
.bd{padding:12px;border-radius:14px;border:0;background:var(--down);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.tg{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border2);background:0;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;font-size:14px}
.tg.on{background:var(--up-soft);color:var(--up);border-color:var(--up)}
.tg.sell{background:var(--down-soft);color:var(--down);border-color:var(--down)}
.tg.tw{background:rgba(251,191,36,.12);color:var(--amber);border-color:var(--amber)}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:0.3px}
.buy-bg{background:var(--up-soft);color:var(--up)}
.sell-bg{background:var(--down-soft);color:var(--down)}
.tw-bg{background:rgba(251,191,36,.12);color:var(--amber)}
.sr{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:0.5px solid var(--border)}
.sr:last-child{border-bottom:0}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--up);color:var(--up);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;pointer-events:none;animation:fadeout .3s 1.8s forwards;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.dd{position:absolute;top:54px;right:12px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:14px;padding:6px;z-index:50;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--text);font-size:14px;cursor:pointer;border-radius:10px;font-family:inherit;border:0;background:0;width:100%;text-align:left}
.dd-item:active{background:var(--surface)}
.dd-icon{font-size:14px;width:22px;text-align:center;flex-shrink:0}
.dd-divider{height:0.5px;background:var(--border);margin:4px 8px}
.blur{filter:blur(8px);user-select:none;-webkit-user-select:none}
.rp{display:inline-flex;align-items:center;justify-content:center;padding:5px 11px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:0;color:var(--muted);font-family:inherit;margin:0 1px;letter-spacing:0.3px}
.rp.on{background:var(--up);color:#000}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--accent,var(--blue))}
.hero{background:var(--surface);border-radius:18px;padding:18px 18px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.hero-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0.5px;margin-bottom:4px;text-transform:uppercase}
.hero-val{font-size:30px;font-weight:700;letter-spacing:-0.8px;margin-bottom:5px}
.hero-chg{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px}
.hero-chg.up{background:var(--up-soft);color:var(--up)}
.hero-chg.down{background:var(--down-soft);color:var(--down)}
.hero-spark{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:80px;height:36px;opacity:.9}
.hold{background:var(--surface);border-radius:14px;padding:11px 12px 11px 14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;cursor:pointer}
.hold-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.hold-bar.up{background:var(--up)}
.hold-bar.down{background:var(--down)}
.hold-bar.flat{background:var(--dim)}
.hold-logo{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.hold-main{flex:1;min-width:0}
.hold-sym{font-size:14px;font-weight:700;letter-spacing:-0.2px}
.hold-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hold-pnl{text-align:right;flex-shrink:0}
.hold-pnl-v{font-size:13px;font-weight:700;letter-spacing:-0.2px}
.hold-pnl-p{font-size:11px;font-weight:600;margin-top:1px}
.sect{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin:14px 0 8px;text-transform:uppercase}
.pst{display:flex;align-items:center;gap:6px;justify-content:center;padding:5px 16px;font-size:10px;color:var(--dim);flex-wrap:wrap;letter-spacing:0.3px}
.pst .dot{width:5px;height:5px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up-glow)}
.chart-wrap{position:relative;width:100%}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--up);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text);white-space:nowrap;z-index:5;opacity:0;transition:opacity .12s;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.chart-tip.on{opacity:1}
.chart-tip .td{color:var(--muted);font-size:10px;margin-bottom:2px}
.chart-tip .tv{font-weight:700;font-size:13px}
.chart-tip .ts{font-size:10px;color:var(--muted);margin-top:2px}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   PORTFOLIO TRACKER v2 — Robinhood-style, Info-Density Variant
   Changes:
   - Pure black bg + neon green accent, pill range selectors
   - Hero card with inline sparkline + 4-up stat grid
   - Header: 4 buttons (hide/currency/refresh/⋯) + settings dropdown
   - Chart 3 views: 總資產 / 淨損益 / 績效% (TWR)
   - One-time migration backfills `ci` for old snapshots
   ============================================================ */
var FK=ld("pt_fk",""),GS=ld("pt_gs","");
var TK="pt_t9",PK="pt_p9",CK="pt_cur",HK="pt_hist9";

function ld(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,8)}
function fm(n){return n!=null&&!isNaN(n)?Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}
function fmTW(n){return n!=null&&!isNaN(n)?Math.round(n).toLocaleString():"—"}
function isTW(s){return/^\d{4,6}$/.test(s)}

var S={
  tr:ld(TK,[]),pr:ld(PK,{}),v:"home",ed:null,det:null,toast:null,tt:null,del:null,
  pv:"",pLoading:false,lastUp:null,cur:ld(CK,"USD"),modal:null,rate:ld("pt_rate",32.5),
  hide:ld("pt_hide",false),synced:false,syncing:false,
  chartRange:"1M",chartCustom:null,chartView:ld("pt_cv","mv"),
  hiddenSyms:ld("pt_hidden",[]),
  menu:false
};
var CHART_DATA=null;

/* Startup: purge invalid trades */
(function(){var c=[],d=false;for(var i=0;i<S.tr.length;i++){var t=S.tr[i];if(t&&t.id&&t.symbol&&String(t.symbol).replace(/\s/g,"")!==""&&t.price!=null&&t.qty!=null&&t.qty>0){c.push(t)}else{d=true}}if(d){S.tr=c;sv(TK,S.tr)}})();

/* One-time history migration: backfill `ci` (cumulative net cost) per currency.
   Older snapshots only had {d,u,t,r}. Walk trades up to each snapshot date to
   reconstruct the cumulative invested cost so TWR works retroactively. */
(function migrateHistory(){
  var hist=ld(HK,[]);if(!hist.length)return;
  for(var i=0;i<hist.length;i++){
    if(hist[i].v!=null&&hist[i].u==null){hist[i].u=hist[i].v;hist[i].t=0;delete hist[i].v}
    if(hist[i].r==null)hist[i].r=S.rate||32.5;
  }
  var needs=false;for(var i=0;i<hist.length;i++){if(hist[i].ci_u==null||hist[i].ci_t==null){needs=true;break}}
  if(!needs)return;
  var trs=S.tr.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  for(var i=0;i<hist.length;i++){
    if(hist[i].ci_u!=null&&hist[i].ci_t!=null)continue;
    var dt=hist[i].d,r=hist[i].r||32.5,ciU=0,ciT=0;
    for(var j=0;j<trs.length;j++){
      var t=trs[j];if(t.date>dt)break;
      var tw=t.cur==="TWD",mul=tw?1000:1,sign=t.action==="buy"?1:-1;
      var cost=t.price*t.qty*mul*sign;
      if(tw)ciT+=cost;else ciU+=cost;
    }
    hist[i].ci_u=ciU;hist[i].ci_t=ciT;hist[i].ci=ciU+ciT/r;
  }
  sv(HK,hist);
})();

function cfgOk(){return FK&&GS&&FK.length>5&&GS.length>10}
function saveCfg(){
  var fk=document.getElementById("cfg_fk"),gs=document.getElementById("cfg_gs");
  if(fk)FK=fk.value.trim();if(gs)GS=gs.value.trim();
  sv("pt_fk",FK);sv("pt_gs",GS);
  if(cfgOk()){toast("設定已儲存 ✓");render()}else toast("請填入完整設定");
}
function clearCfg(){if(confirm("確定要清除所有設定和資料？\n這會刪除本機所有交易、報價、歷史紀錄。")){localStorage.clear();FK="";GS="";S.tr=[];S.pr={};render()}}

function set(p){for(var k in p)S[k]=p[k];sv(TK,S.tr);render()}
function toast(m){if(S.tt)clearTimeout(S.tt);S.toast=m;S.tt=setTimeout(function(){S.toast=null;render()},2000);render()}
function toDisp(v,cur){return S.cur==="TWD"?(cur==="TWD"?v:v*S.rate):(cur==="TWD"?v/S.rate:v)}
function ds(){return S.cur==="TWD"?"NT$":"$"}
function dfm(v){return S.cur==="TWD"?fmTW(v):fm(v)}
function H(v){return S.hide?'<span class="blur">'+v+'</span>':v}
function gp(s){return S.pr[s]?S.pr[s].p:null}
function esc(s){return String(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function isHidden(sym){return S.hiddenSyms.indexOf(sym)>=0}
function toggleHidePos(sym){var idx=S.hiddenSyms.indexOf(sym);if(idx>=0)S.hiddenSyms.splice(idx,1);else S.hiddenSyms.push(sym);sv("pt_hidden",S.hiddenSyms);render()}
function setChartView(v){S.chartView=v;sv("pt_cv",v);render()}
function tickerColor(sym){var palette=["#00D26A","#4287f5","#a48bf5","#fbbf24","#FF5252","#60a5fa","#f472b6","#34d399","#fb923c"];var h=0;for(var i=0;i<sym.length;i++)h=(h*31+sym.charCodeAt(i))>>>0;return palette[h%palette.length]}

function cloudSave(){
  if(!GS){toast("請先設定 Google Apps Script URL");return}
  S.syncing=true;S.menu=false;render();
  var hist=ld(HK,[]);
  fetch(GS,{method:"POST",body:JSON.stringify({trades:JSON.stringify(S.tr),prices:JSON.stringify(S.pr),history:JSON.stringify(hist)})}).then(function(){S.synced=true;S.syncing=false;toast("已上傳至雲端 ✓")}).catch(function(){S.syncing=false;toast("上傳失敗");render()});
}
function cloudLoad(){
  if(!GS){toast("請先設定 Google Apps Script URL");return}
  S.menu=false;S.syncing=true;render();
  fetch(GS+"?action=read").then(function(r){return r.json()}).then(function(d){
    if(d.ok&&d.trades){try{
      var ct=JSON.parse(d.trades),cp=d.prices?JSON.parse(d.prices):{};
      if(Array.isArray(ct)){
        var valid=[];
        for(var i=0;i<ct.length;i++){var t=ct[i];if(!t||!t.id)continue;if(!t.symbol||String(t.symbol).replace(/\s/g,"")==="")continue;if(!t.action)t.action="buy";if(!t.price&&t.price!==0)t.price=0;if(!t.qty&&t.qty!==0)t.qty=0;if(t.qty<=0)continue;if(!t.date)t.date="2025-01-01";if(!t.cur)t.cur=isTW(t.symbol)?"TWD":"USD";if(!t.type)t.type="stock";valid.push(t)}
        S.tr=valid;for(var k in cp)S.pr[k]=cp[k];sv(TK,S.tr);sv(PK,S.pr);
        if(d.history){try{var ch=JSON.parse(d.history);if(Array.isArray(ch)&&ch.length)sv(HK,ch)}catch(e){}}
      }
      S.synced=true;toast("已從雲端下載 ✓")}catch(e){toast("雲端資料解析失敗")}}else toast("雲端無資料")
    S.syncing=false;render();
  }).catch(function(){S.syncing=false;toast("下載失敗");render()});
}
function saveLocal(){sv(TK,S.tr);sv(PK,S.pr)}

function calc(){
  var p={},cl=[];
  var sorted=S.tr.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  for(var i=0;i<sorted.length;i++){var t=sorted[i];if(!t.symbol)continue;
    var tw=t.cur==="TWD",mul=tw?1000:1;
    if(!p[t.symbol])p[t.symbol]={s:t.symbol,tp:t.type,cur:t.cur||"USD",q:0,c:0,bs:[]};var P=p[t.symbol];
    var cost=t.price*t.qty*mul;
    if(t.action==="buy"){P.q+=t.qty;P.c+=cost;P.bs.push({p:t.price*mul,r:t.qty,op:t.price,d:t.date||""})}
    else{var r=t.qty,cb=0,matches=[];while(r>0&&P.bs.length){var b=P.bs[0],k=Math.min(r,b.r);cb+=k*b.p;matches.push({buyPrice:b.op,qty:k,cost:k*b.p,date:b.d});r-=k;b.r-=k;if(b.r<=0)P.bs.shift()}P.q-=t.qty;P.c-=cb;cl.push({s:t.symbol,cur:t.cur||"USD",pnl:t.price*t.qty*mul-cb,qty:t.qty,price:t.price,date:t.date||"",cb:cb,matches:matches})}}
  var op=[];for(var k in p){if(p[k].q>0)op.push({s:p[k].s,tp:p[k].tp,cur:p[k].cur,q:p[k].q,avg:p[k].c/p[k].q,c:p[k].c})}
  return{op:op,cl:cl};
}

function fetchOne(sym){
  if(isTW(sym)){if(!GS)return Promise.resolve(null);return fetch(GS+"?action=twprice&sym="+sym).then(function(r){return r.json()}).then(function(d){return d.ok&&d.price>0?{p:d.price,pc:d.yesterday||null}:null}).catch(function(){return null})}
  if(!FK)return Promise.resolve(null);
  return fetch("https://finnhub.io/api/v1/quote?symbol="+sym+"&token="+FK).then(function(r){return r.json()}).then(function(d){return d.c>0?{p:d.c,pc:d.pc||null}:null}).catch(function(){return null})
}
function fetchRate(){return fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(d){if(d.rates&&d.rates.TWD){S.rate=d.rates.TWD;sv("pt_rate",S.rate)}}).catch(function(){})}
function fetchPrices(silent){
  var pf=calc();if(!pf.op.length)return;
  if(!silent){S.pLoading=true;render()}
  fetchRate().then(function(){
    var chain=Promise.resolve(),np={};for(var k in S.pr)np[k]=S.pr[k];var ok=0;
    for(var i=0;i<pf.op.length;i++){(function(pos){chain=chain.then(function(){return fetchOne(pos.s).then(function(r){if(r&&r.p){np[pos.s]={p:r.p,pc:r.pc,at:Date.now()};ok++}}).then(function(){return new Promise(function(re){setTimeout(re,400)})})})})(pf.op[i])}
    chain.then(function(){S.pr=np;S.pLoading=false;S.lastUp=new Date();sv(PK,np);snapHistory();if(!silent)toast(ok?"已更新 "+ok+" 檔報價 ✓":"更新失敗");else render()})
  })
}

/* Record today's snapshot: market value + cumulative net cost (per currency) */
function snapHistory(){
  var hist=ld(HK,[]);
  var sorted=S.tr.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  var today=new Date().toISOString().slice(0,10);
  var pf=calc(),mvU=0,mvT=0;
  for(var i=0;i<pf.op.length;i++){
    var x=pf.op[i];if(isHidden(x.s))continue;
    var p=gp(x.s),tw=x.cur==="TWD",mv=p?p*x.q*(tw?1000:1):x.c;
    if(tw)mvT+=mv;else mvU+=mv;
  }
  var ciU=0,ciT=0;
  for(var i=0;i<sorted.length;i++){var t=sorted[i];if(t.date>today)break;if(isHidden(t.symbol))continue;
    var tw=t.cur==="TWD",mul=tw?1000:1,sign=t.action==="buy"?1:-1;
    var cost=t.price*t.qty*mul*sign;
    if(tw)ciT+=cost;else ciU+=cost;
  }
  var rate=S.rate||32.5,entry={d:today,u:mvU,t:mvT,r:rate,ci_u:ciU,ci_t:ciT,ci:ciU+ciT/rate};
  var found=false;
  for(var i=0;i<hist.length;i++){if(hist[i].d===today){hist[i]=entry;found=true;break}}
  if(!found)hist.push(entry);
  if(hist.length>365)hist=hist.slice(hist.length-365);
  sv(HK,hist);render();
}

/* Build series with all three views computed.
   - mv: market value in display currency
   - pnl: mv - cumulative cost (display currency)
   - twr: time-weighted return index, starting at 100, currency-agnostic */
function buildChartSeries(hist){
  if(!hist||!hist.length)return[];
  var H=hist.slice().sort(function(a,b){return a.d<b.d?-1:1}),out=[];
  for(var i=0;i<H.length;i++){
    var h=H[i],r=h.r||S.rate||32.5,mv,ci;
    if(S.cur==="TWD"){mv=(h.u||0)*r+(h.t||0);ci=(h.ci_u||0)*r+(h.ci_t||0)}
    else{mv=(h.u||0)+(h.t||0)/r;ci=(h.ci_u||0)+(h.ci_t||0)/r}
    out.push({d:h.d,mv:mv,ci:ci,pnl:mv-ci})
  }
  var idx=100;out[0].twr=100;
  for(var i=1;i<out.length;i++){
    var prevMV=out[i-1].mv,flow=out[i].ci-out[i-1].ci;
    if(prevMV<=0){idx=100;out[i].twr=100;continue}
    var r=(out[i].mv-flow)/prevMV;
    if(!isFinite(r)||r<=0){out[i].twr=idx;continue}
    idx=idx*r;out[i].twr=idx;
  }
  return out;
}

function getChartData(range,cf,ct){
  var hist=ld(HK,[]);if(!hist.length)return[];
  var series=buildChartSeries(hist),view=S.chartView||"mv",picked=[];
  for(var i=0;i<series.length;i++){
    var s=series[i],v;
    if(view==="mv")v=s.mv;
    else if(view==="pnl")v=s.pnl;
    else v=s.twr-100;
    picked.push({d:s.d,v:v,mv:s.mv,pnl:s.pnl,twr:s.twr,ci:s.ci})
  }
  var now=new Date(),from;
  if(range==="custom"&&cf){from=new Date(cf);var to=ct?new Date(ct):now;return picked.filter(function(h){var d=new Date(h.d);return d>=from&&d<=to})}
  if(range==="7D"){from=new Date(now);from.setDate(from.getDate()-7)}
  else if(range==="1M"){from=new Date(now);from.setMonth(from.getMonth()-1)}
  else if(range==="3M"){from=new Date(now);from.setMonth(from.getMonth()-3)}
  else if(range==="6M"){from=new Date(now);from.setMonth(from.getMonth()-6)}

  return picked.filter(function(h){return new Date(h.d)>=from})
}

function attachChartHover(){
  if(!CHART_DATA)return;
  var svg=document.getElementById("chartSvg"),overlay=document.getElementById("chartOverlay"),hover=document.getElementById("chartHover"),line=document.getElementById("chartHoverLine"),dot=document.getElementById("chartHoverDot"),tip=document.getElementById("chartTip"),tipDate=document.getElementById("chartTipDate"),tipVal=document.getElementById("chartTipVal"),tipSub=document.getElementById("chartTipSub"),wrap=document.getElementById("chartWrap");
  if(!svg||!overlay||!hover||!tip||!wrap)return;
  function findNearest(svgX){var pts=CHART_DATA.pts,bestI=0,bestD=Infinity;for(var i=0;i<pts.length;i++){var d=Math.abs(pts[i].x-svgX);if(d<bestD){bestD=d;bestI=i}}return bestI}
  function moveHandler(clientX){
    var rect=svg.getBoundingClientRect();if(rect.width<=0)return;
    var ratio=CHART_DATA.w/rect.width,svgX=(clientX-rect.left)*ratio;
    var idx=findNearest(svgX),pt=CHART_DATA.pts[idx],d=CHART_DATA.data[idx];
    hover.style.display="block";
    line.setAttribute("x1",pt.x.toFixed(1));line.setAttribute("x2",pt.x.toFixed(1));
    dot.setAttribute("cx",pt.x.toFixed(1));dot.setAttribute("cy",pt.y.toFixed(1));
    var wrapRect=wrap.getBoundingClientRect(),cssX=pt.x/ratio,cssY=pt.y/ratio;
    tipDate.textContent=d.d;
    var v=d.v,view=CHART_DATA.view,D=CHART_DATA.D,primary,secondary="";
    if(view==="mv"){primary=D+dfm(v);if(d.pnl!=null)secondary=(d.pnl>=0?"淨損益 +":"淨損益 -")+D+dfm(Math.abs(d.pnl))}
    else if(view==="pnl"){primary=(v>=0?"+":"-")+D+dfm(Math.abs(v));if(d.mv!=null)secondary="總資產 "+D+dfm(d.mv)}
    else{primary=(v>=0?"+":"")+fm(v)+"%";secondary="指數 "+fm(d.twr)}
    if(S.hide&&view!=="twr"){tipVal.innerHTML='<span class="blur">'+primary+'</span>';tipSub.innerHTML=secondary?'<span class="blur">'+secondary+'</span>':''}
    else{tipVal.textContent=primary;tipSub.textContent=secondary}
    tip.classList.add("on");
    var tipW=tip.offsetWidth||80,tipH=tip.offsetHeight||40;
    var tx=cssX-tipW/2;if(tx<2)tx=2;if(tx+tipW>wrapRect.width-2)tx=wrapRect.width-tipW-2;
    var ty=cssY-tipH-10;if(ty<2)ty=cssY+12;
    tip.style.left=tx+"px";tip.style.top=ty+"px";
  }
  function leaveHandler(){hover.style.display="none";tip.classList.remove("on")}
  overlay.addEventListener("mousemove",function(e){moveHandler(e.clientX)});
  overlay.addEventListener("mouseleave",leaveHandler);
  overlay.addEventListener("touchstart",function(e){if(e.touches.length){moveHandler(e.touches[0].clientX);e.preventDefault()}},{passive:false});
  overlay.addEventListener("touchmove",function(e){if(e.touches.length){moveHandler(e.touches[0].clientX);e.preventDefault()}},{passive:false});
  overlay.addEventListener("touchend",leaveHandler);
  overlay.addEventListener("touchcancel",leaveHandler);
}

      h+='<div class="stat" style="--accent:var(--blue)"><div class="stat-label">持倉市值</div><div class="stat-val">'+H(D+dfm(tMV))+'</div></div>';
      h+='<div class="stat" style="--accent:'+(tU>=0?"var(--up)":"var(--down)")+'"><div class="stat-label">未實現盈虧</div><div class="stat-val">'+H((tU>=0?"+":"-")+D+dfm(Math.abs(tU)))+'</div></div>';
      h+='<div class="stat" style="--accent:'+(tRP>=0?"var(--up)":"var(--down)")+'"><div class="stat-label">已實現盈虧</div><div class="stat-val">'+H((tRP>=0?"+":"-")+D+dfm(Math.abs(tRP)))+'</div></div>';
      h+='<div class="stat" style="--accent:var(--purple)"><div class="stat-label">持倉成本</div><div class="stat-val">'+H(D+dfm(tTC))+'</div></div>';
      h+='</div>';

      /* Total P&L */
      var tpc=totalPnl>=0?"var(--up)":"var(--down)";
      h+='<div class="cd" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:14px 16px;border-left:3px solid '+tpc+';border-radius:14px"><div><div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase">總盈虧（未實現＋已實現）</div><div style="font-size:19px;font-weight:700;color:'+tpc+';letter-spacing:-0.4px">'+H((totalPnl>=0?"+":"-")+D+dfm(Math.abs(totalPnl)))+'</div></div><div style="font-size:16px;font-weight:700;color:'+tpc+'">'+H((totalPnlPct>=0?"+":"")+fm(totalPnlPct)+"%")+'</div></div>';

      /* Chart with view toggle */
      var ranges=["7D","1M","3M","6M","YTD","ALL"];
      h+='<div class="cd" style="padding:14px 16px;margin-bottom:10px">';
      h+='<div style="display:flex;gap:6px;margin-bottom:12px">';
      h+='<button class="rp '+(S.chartView==="mv"?"on":"")+'" onclick="setChartView(\'mv\')" style="flex:1;padding:7px 8px;font-size:11px">總資產</button>';
      h+='<button class="rp '+(S.chartView==="pnl"?"on":"")+'" onclick="setChartView(\'pnl\')" style="flex:1;padding:7px 8px;font-size:11px">淨損益</button>';
      h+='<button class="rp '+(S.chartView==="twr"?"on":"")+'" onclick="setChartView(\'twr\')" style="flex:1;padding:7px 8px;font-size:11px">績效 %</button>';
      h+='</div>';
      h+='<div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:0">';
      for(var ri=0;ri<ranges.length;ri++)h+='<button class="rp '+(S.chartRange===ranges[ri]?"on":"")+'" onclick="S.chartRange=\''+ranges[ri]+'\';render()">'+ranges[ri]+'</button>';
      h+='<button class="rp '+(S.chartRange==="custom"?"on":"")+'" onclick="S.chartRange=\'custom\';if(!S.chartCustom)S.chartCustom={};render()">自定義</button></div>';
      if(S.chartRange==="custom"){var ccf=S.chartCustom&&S.chartCustom.from||"",cct=S.chartCustom&&S.chartCustom.to||"";h+='<div style="display:flex;gap:8px;margin-bottom:10px"><input type="date" class="inp" style="flex:1;font-size:12px;padding:8px" value="'+ccf+'" onchange="if(!S.chartCustom)S.chartCustom={};S.chartCustom.from=this.value;render()"><input type="date" class="inp" style="flex:1;font-size:12px;padding:8px" value="'+cct+'" onchange="if(!S.chartCustom)S.chartCustom={};S.chartCustom.to=this.value;render()"></div>'}
      var cd=getChartData(S.chartRange,S.chartCustom?S.chartCustom.from:null,S.chartCustom?S.chartCustom.to:null);
      h+=renderChart(cd,440,210);
      var hint="";
      if(S.chartView==="mv")hint="總資產 = 持倉市值合計。受加碼/減碼影響，會跟著資金進出變動。";
      else if(S.chartView==="pnl")hint="淨損益 = 市值 - 累計投入成本。免疫資金進出，反映實際賺賠。";
      else hint="績效指數 = 時間加權報酬率（TWR），起點 100。完全免疫資金流動，僅看「操作好壞」。";
      h+='<div style="margin-top:8px;font-size:10px;color:var(--dim);line-height:1.5;letter-spacing:0.2px">💡 '+hint+'</div>';
      h+='</div>';

      /* Donut */
      var slices=[];
      for(var i=0;i<pf.op.length;i++){var x=pf.op[i];if(isHidden(x.s))continue;var p=gp(x.s),tw=x.cur==="TWD",mv=p?p*x.q*(tw?1000:1):x.c;slices.push({s:x.s,v:toDisp(mv,x.cur)})}
      if(slices.length>1){slices.sort(function(a,b){return b.v-a.v});h+=renderDonut(slices,tMV)}

      /* Holdings */
      h+='<div class="sect">持倉</div>';
      for(var i=0;i<pf.op.length;i++){var x=pf.op[i];if(isHidden(x.s))continue;
        var p=gp(x.s),tw=x.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
        var avgPS=tw?x.avg/1000:x.avg,mV=p?p*x.q*(tw?1000:1):null,u=p?(p*(tw?1000:1)-x.avg)*x.q:null,rt=p?((p*(tw?1000:1)-x.avg)/x.avg)*100:null;
        var pc=u!=null?(u>=0?"var(--up)":"var(--down)"):"var(--muted)",barClass=u==null?"flat":(u>=0?"up":"down"),tCol=tickerColor(x.s);
        h+='<div class="hold" onclick="S.det=\''+x.s+'\';S.pv=\'\';set({v:\'det\'})">';
        h+='<div class="hold-bar '+barClass+'"></div>';
        h+='<div class="hold-logo" style="background:'+tCol+'22;color:'+tCol+'">'+(tw?'🇹🇼':x.s.charAt(0))+'</div>';
        h+='<div class="hold-main"><div class="hold-sym">'+x.s+'</div>';
        var subline=H(x.q+(tw?" 張":" 股"))+' · 均價 '+ps+f(avgPS);
        if(p){var prData=S.pr[x.s],pcv=prData&&prData.pc?prData.pc:null;subline+=' · '+ps+f(p);
          if(pcv){var dc=p-pcv,dcp=pcv>0?(dc/pcv*100):0,dcCol=dc>=0?"var(--up)":"var(--down)";subline+=' <span style="color:'+dcCol+'">'+(dc>=0?"+":"")+fm(dcp)+"%</span>"}}
        h+='<div class="hold-sub">'+subline+'</div></div>';
        h+='<div class="hold-pnl"><div class="hold-pnl-v" style="color:'+pc+'">'+H(u!=null?(u>=0?"+":"-")+ps+f(Math.abs(u)):ps+f(x.c))+'</div>';
        h+='<div class="hold-pnl-p" style="color:'+pc+'">'+H(rt!=null?(rt>=0?"+":"")+fm(rt)+"%":"輸入報價")+'</div></div>';
        h+='</div>';
      }

      /* Hidden positions */
      var hiddenOps=[];for(var i=0;i<pf.op.length;i++){if(isHidden(pf.op[i].s))hiddenOps.push(pf.op[i])}
      if(hiddenOps.length){
        h+='<div class="sect" style="display:flex;justify-content:space-between;align-items:center">已隱藏 ('+hiddenOps.length+')<button onclick="S._showHidden=!S._showHidden;render()" style="background:0;border:0;color:var(--muted);cursor:pointer;font-size:11px;letter-spacing:0;text-transform:none;font-weight:600">'+(S._showHidden?"▲ 收起":"▼ 展開")+'</button></div>';
        if(S._showHidden){for(var i=0;i<hiddenOps.length;i++){var x=hiddenOps[i],tw=x.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
          h+='<div class="cd" style="display:flex;justify-content:space-between;align-items:center;opacity:.55;padding:10px 14px"><div><div style="font-weight:700;font-size:13px">'+x.s+'</div><div style="font-size:11px;color:var(--muted)">'+H(x.q+(tw?" 張":" 股"))+'</div></div><button onclick="toggleHidePos(\''+x.s+'\')" style="background:var(--up-soft);border:1px solid var(--up);color:var(--up);padding:5px 11px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">顯示</button></div>'}}
      }

      /* Closed positions */
      if(pf.cl.length){
        var clRP=0,clCB=0;for(var i=0;i<pf.cl.length;i++){if(!isHidden(pf.cl[i].s)){var c2=pf.cl[i];clRP+=toDisp(c2.pnl,c2.cur);clCB+=toDisp(c2.cb,c2.cur)}}
        var clPct=clCB>0?(clRP/clCB*100):0,clCol=clRP>=0?"var(--up)":"var(--down)";
        h+='<div class="sect">已平倉</div>';
        h+='<div class="cd" style="border-left:3px solid '+clCol+';margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px"><div><div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase">已實現盈虧合計</div><div style="font-size:17px;font-weight:700;color:'+clCol+';letter-spacing:-0.3px">'+H((clRP>=0?"+":"-")+D+dfm(Math.abs(clRP)))+'</div></div><div style="font-size:15px;font-weight:700;color:'+clCol+'">'+H((clPct>=0?"+":"")+fm(clPct)+"%")+'</div></div>';
        for(var i=0;i<pf.cl.length;i++){var c=pf.cl[i],cSym=c.s||"???",cQty=c.qty||0,cPrice=c.price||0,cDate=c.date||"",g=c.pnl>=0,cl2=g?"var(--up)":"var(--down)",tw=c.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
          h+='<div class="hold" onclick="S.clIdx='+i+';set({v:\'cldet\'})"><div class="hold-bar '+(g?"up":"down")+'"></div><div class="hold-logo" style="background:'+(g?"var(--up-soft)":"var(--down-soft)")+';color:'+cl2+';font-size:14px">✓</div><div class="hold-main"><div class="hold-sym">'+cSym+(tw?' <span class="badge tw-bg">台</span>':"")+'</div><div class="hold-sub">'+H(cQty+(tw?" 張":" 股"))+" @ "+ps+f(cPrice)+" · "+cDate+'</div></div><div class="hold-pnl"><div class="hold-pnl-v" style="color:'+cl2+'">'+H((g?"+":"-")+ps+f(Math.abs(c.pnl)))+'</div>'+(c.cb>0?'<div class="hold-pnl-p" style="color:'+cl2+'">'+H((c.pnl/c.cb*100>=0?"+":"")+fm(c.pnl/c.cb*100)+"%")+'</div>':"")+'</div></div>'}
      }
    }
  } else {
    /* Trades list */
    h+='<div class="sect">交易紀錄 ('+S.tr.length+')</div>';
    var sorted=S.tr.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    for(var i=0;i<sorted.length;i++){var t=sorted[i],tSym=t.symbol||"???",tPrice=t.price||0,tQty=t.qty||0,buy=t.action==="buy",tw=t.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
      h+='<div class="cd" style="display:flex;align-items:center;gap:10px;padding:11px 12px"><div style="width:3px;height:34px;border-radius:2px;background:'+(buy?"var(--up)":"var(--down)")+'"></div><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:2px"><span class="badge '+(buy?"buy-bg":"sell-bg")+'">'+(buy?"買入":"賣出")+'</span>'+(tw?'<span class="badge tw-bg">台</span>':"")+'<span style="font-weight:700;font-size:13px">'+tSym+'</span><span style="color:var(--muted);font-size:12px">@'+ps+f(tPrice)+'</span></div><div style="font-size:11px;color:var(--muted)">'+H(tQty+(tw?" 張":" 股"))+" · "+H(ps+f(tQty*tPrice*(tw?1000:1)))+" · "+t.date+'</div></div>';
      h+='<button onclick="var t=findTr(\''+t.id+'\');if(t){S.ed=JSON.parse(JSON.stringify(t));initF(S.ed);set({v:\'form\'})}" style="background:0;border:0;color:var(--muted);cursor:pointer;font-size:14px">✏️</button>';
      h+='<button onclick="set({del:findTr(\''+t.id+'\')})" style="background:0;border:0;color:var(--muted);cursor:pointer;font-size:14px">🗑</button></div>'}
  }
  h+='</div></div>';h+=nav(S.v);
  if(S.toast)h+='<div class="toast">'+S.toast+'</div>';
  if(S.del)h+='<div class="modal" onclick="if(event.target===this)set({del:null})"><div class="cd" style="padding:22px;max-width:340px;background:var(--surface2)"><div style="font-weight:700;margin-bottom:12px;font-size:15px">刪除此交易？</div><div style="display:flex;gap:10px"><button class="bs" onclick="set({del:null})">取消</button><button class="bd" onclick="S.tr=S.tr.filter(function(x){return x.id!==S.del.id});S.del=null;saveLocal();toast(\'已刪除\');render()">刪除</button></div></div></div>';
  fin(h);
}catch(e){document.getElementById("app").innerHTML='<div style="padding:40px;color:var(--down)"><b>Error:</b> '+e.message+'<br><br><small>'+(e.stack||"").replace(/\n/g,"<br>")+'</small></div>'}}

function fin(h){
  document.getElementById("app").innerHTML=h;
  if(document.getElementById("chartSvg"))attachChartHover();
  if(S.menu){setTimeout(function(){document.addEventListener("click",closeMenuHandler,{once:true})},0)}
}
function closeMenuHandler(e){if(!e.target.closest||(!e.target.closest(".dd")&&!e.target.closest("[title='選單']"))){S.menu=false;render()}}
function nav(v){return'<div class="nav"><button class="nb '+(v==="home"?"on":"")+'" onclick="S.ed=null;initF();set({v:\'home\'})"><span style="font-size:18px">💼</span>總覽</button><button class="fab" onclick="S.ed=null;initF();set({v:\'form\'})">+</button><button class="nb '+(v==="trades"?"on":"")+'" onclick="S.ed=null;initF();set({v:\'trades\'})"><span style="font-size:18px">📋</span>交易</button></div>'}
function sr(l,v,c){return'<div class="sr"><span style="font-size:13px;color:var(--muted)">'+l+'</span><span style="font-weight:600;font-size:14px;color:'+c+'">'+v+'</span></div>'}
function timeAgo(d){var m=Math.round((Date.now()-d.getTime())/60000);return m<1?"剛剛":m<60?m+"分鐘前":Math.floor(m/60)+"小時前"}

render();
setTimeout(function(){fetchPrices(true)},2000);
setInterval(function(){fetchPrices(true)},1800000);
</script>
</body>
</html>
