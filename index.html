<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#0b1120">
<title>Portfolio Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,'SF Pro Display','Noto Sans TC',system-ui,sans-serif;background:#0b1120;color:#e0e7f0;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.hdr{padding:14px 20px;border-bottom:1px solid #1e2d45;background:rgba(11,17,32,.95);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;z-index:20}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.cnt{padding:16px 20px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:10px 20px 14px;background:linear-gradient(to top,#0b1120 60%,transparent);z-index:20}
@supports(padding:env(safe-area-inset-bottom)){.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.hdr{padding-top:calc(14px + env(safe-area-inset-top))}}
.nb{background:0;border:0;color:#7b8da4;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 16px;font-family:inherit}
.nb.on{color:#00ddb8}
.fab{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00ddb8,#00bb9a);border:0;color:#0b1120;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 4px 20px rgba(0,221,184,.25)}
.fab:active{transform:scale(.93)}
.cd{background:#131c2e;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.inp{width:100%;background:#0b1120;border:1px solid #1e2d45;border-radius:10px;padding:11px 14px;color:#e0e7f0;font-size:15px;outline:0;font-family:inherit;box-sizing:border-box}
.inp:focus{border-color:#00ddb8}
.bp{flex:1;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#00ddb8,#00bb9a);color:#0b1120;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bp:disabled{opacity:.4}
.bs{flex:1;padding:12px;border-radius:12px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-size:15px;cursor:pointer;font-family:inherit}
.tg{flex:1;padding:10px;border-radius:10px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.tg.on{background:rgba(0,221,184,.12);color:#00ddb8;border-color:#00ddb8}
.tg.sell{background:rgba(255,68,68,.12);color:#f44;border-color:#f44}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.buy-bg{background:rgba(0,221,184,.12);color:#00ddb8}
.sell-bg{background:rgba(255,68,68,.12);color:#f44}
.sr{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e2d45}
.sr:last-child{border-bottom:0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#131c2e;border:1px solid #00ddb8;color:#00ddb8;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;pointer-events:none;animation:fadeout .3s 1.8s forwards}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.rfb{background:rgba(0,221,184,.12);border:1px solid rgba(0,221,184,.2);color:#00ddb8;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.pst{display:flex;align-items:center;gap:6px;justify-content:center;padding:6px;font-size:11px;color:#7b8da4}
.dot{width:6px;height:6px;border-radius:50%;background:#00ddb8}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FK="cvt2euhr01qladq0s6h0cvt2euhr01qladq0s6hg",TK="pt_t9",PK="pt_p9";
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const uid=()=>Math.random().toString(36).slice(2,8);
const fm=(n)=>n!=null&&!isNaN(n)?Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let S={tr:ld(TK,[]),pr:ld(PK,{}),v:"home",ed:null,det:null,toast:null,tt:null,del:null,pv:"",pLoading:false,lastUp:null};
const set=p=>{Object.assign(S,p);sv(TK,S.tr);render()};
const toast=m=>{if(S.tt)clearTimeout(S.tt);S.toast=m;S.tt=setTimeout(()=>{S.toast=null;render()},2e3);render()};

function calc(){
  const p={},cl=[];
  [...S.tr].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{
    if(!p[t.symbol])p[t.symbol]={s:t.symbol,tp:t.type,q:0,c:0,bs:[]};const P=p[t.symbol];
    if(t.action==="buy"){P.q+=t.qty;P.c+=t.qty*t.price;P.bs.push({p:t.price,r:t.qty})}
    else{let r=t.qty,cb=0;while(r>0&&P.bs.length){const b=P.bs[0],k=Math.min(r,b.r);cb+=k*b.p;r-=k;b.r-=k;if(b.r<=0)P.bs.shift()}P.q-=t.qty;P.c-=cb;cl.push({s:t.symbol,pnl:t.qty*t.price-cb,qty:t.qty,price:t.price,date:t.date,cb})}
  });
  const op=Object.values(p).filter(x=>x.q>0).map(x=>({s:x.s,tp:x.tp,q:x.q,avg:x.c/x.q,c:x.c}));
  return{op,cl,tc:op.reduce((s,x)=>s+x.c,0),tp:cl.reduce((s,x)=>s+x.pnl,0)};
}
const gp=s=>S.pr[s]?.p||null;
const esc=s=>String(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");

// Price fetch
async function fetchPrices(silent){
  const pf=calc();if(!pf.op.length)return;
  if(!silent){S.pLoading=true;render()}
  const np={...S.pr};let ok=0;
  for(const pos of pf.op){
    if(pos.tp==="crypto")continue;
    try{const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${pos.s}&token=${FK}`);
    if(r.ok){const d=await r.json();if(d.c>0){np[pos.s]={p:d.c,at:Date.now()};ok++}}}catch{}
    await new Promise(r=>setTimeout(r,300));
  }
  S.pr=np;S.pLoading=false;S.lastUp=new Date();sv(PK,np);
  if(!silent)toast(ok?`已更新 ${ok} 檔報價 ✓`:"更新失敗，請手動輸入");else render();
}

// Form state
let F={type:"stock",symbol:"",action:"buy",price:"",qty:"",date:new Date().toISOString().slice(0,10),note:""};
function initF(t){F=t?{...t}:{type:"stock",symbol:"",action:"buy",price:"",qty:"",date:new Date().toISOString().slice(0,10),note:""}}
function readF(){["f_s","f_p","f_q","f_d"].forEach(id=>{const el=document.getElementById(id);if(!el)return;const k={f_s:"symbol",f_p:"price",f_q:"qty",f_d:"date"}[id];F[k]=id==="f_s"?el.value.toUpperCase():el.value})}
function updTot(){readF();const el=document.getElementById("ftot");if(el)el.textContent="$"+fm((+F.price||0)*(+F.qty||0));const btn=document.getElementById("sbtn");if(btn)btn.disabled=!(F.symbol&&F.price&&F.qty&&+F.price>0&&+F.qty>0)}
function setFType(v){readF();F.type=v;render()}
function setFAct(v){readF();F.action=v;render()}
function submitF(){readF();if(!F.symbol||!F.price||!F.qty)return;
  const t={id:F.id||uid(),type:F.type,symbol:F.symbol.toUpperCase(),action:F.action,price:+F.price,qty:+F.qty,date:F.date,note:""};
  if(S.ed)S.tr=S.tr.map(x=>x.id===t.id?t:x);else S.tr=[...S.tr,t];
  S.ed=null;S.v="trades";sv(TK,S.tr);toast(S.ed?"已更新 ✓":"已新增 ✓");render();setTimeout(()=>fetchPrices(true),500)}
function savePr(){const v=parseFloat(S.pv);if(!S.det||isNaN(v)||v<=0)return;S.pr[S.det]={p:v,at:Date.now()};S.pv="";sv(PK,S.pr);toast(`${S.det} $${fm(v)} ✓`);render()}

const SAM=[{id:"a",type:"stock",symbol:"TSLA",action:"buy",price:310,qty:340,date:"2025-11-29"},{id:"b",type:"stock",symbol:"GOOGL",action:"buy",price:245,qty:406,date:"2025-11-29"},{id:"c",type:"stock",symbol:"GOOGL",action:"buy",price:317,qty:35,date:"2026-02-10"},{id:"d",type:"stock",symbol:"GOOGL",action:"buy",price:311,qty:39,date:"2026-02-12"},{id:"e",type:"stock",symbol:"INTC",action:"buy",price:37,qty:550,date:"2025-10-01"},{id:"f",type:"stock",symbol:"INTC",action:"sell",price:43.5,qty:550,date:"2026-01-26"},{id:"g",type:"stock",symbol:"AMD",action:"buy",price:207,qty:173,date:"2026-02-23"},{id:"h",type:"stock",symbol:"AMD",action:"sell",price:222.67,qty:173,date:"2026-02-24"}];

function render(){
  const app=document.getElementById("app"),pf=calc();let h="";

  // DETAIL
  if(S.v==="det"&&S.det){
    const pos=pf.op.find(x=>x.s===S.det);
    if(!pos){S.v="home";S.det=null;render();return}
    const p=gp(S.det),mV=p?p*pos.q:null,u=p?(p-pos.avg)*pos.q:null,rt=p?((p-pos.avg)/pos.avg)*100:null;
    const pc=u!=null?(u>=0?"#00ddb8":"#f44"):"#7b8da4";
    const rP=pf.cl.filter(c=>c.s===S.det).reduce((s,c)=>s+c.pnl,0);
    const st=S.tr.filter(t=>t.symbol===S.det).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const pAt=S.pr[S.det]?.at;

    h+=`<div class="hdr"><button onclick="set({v:'home',det:null})" style="background:0;border:0;color:#7b8da4;font-size:18px;cursor:pointer">‹ 返回</button></div>`;
    h+=`<div class="scr"><div class="cnt">`;
    h+=`<div style="text-align:center;padding:0 0 24px"><div style="font-size:32px;font-weight:800">${S.det}</div>`;
    h+=`<div style="font-size:22px;color:#7b8da4;margin-top:6px">${mV!=null?"$ "+fm(mV):"尚未設定報價"}</div>`;
    if(rt!=null)h+=`<div style="font-size:15px;color:${pc};margin-top:4px">${rt>=0?"+":""}${fm(rt)}%</div>`;
    h+=`</div>`;
    // Price input
    h+=`<div class="cd" style="padding:16px;margin-bottom:16px"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:8px">更新當前報價</div>`;
    h+=`<div style="display:flex;gap:8px"><input type="number" step="any" class="inp" style="flex:1" value="${esc(S.pv)}" oninput="S.pv=this.value" placeholder="${p||'輸入價格'}"><button class="bp" style="flex:none;padding:10px 16px" onclick="savePr()">更新</button></div></div>`;
    // Stats
    h+=`<div class="cd" style="padding:0;overflow:hidden">`;
    h+=sr("當前價格",p?"$ "+fm(p):"未設定","#e0e7f0")+sr("數量",fm(pos.q),"#e0e7f0")+sr("報酬率",rt!=null?(rt>=0?"+":"")+fm(rt)+"%":"—",pc)+sr("單位成本","$ "+fm(pos.avg),"#e0e7f0")+sr("總成本","$ "+fm(pos.c),"#e0e7f0")+sr("損益",u!=null?(u>=0?"+":"-")+"$"+fm(Math.abs(u)):"—",pc)+sr("已實現損益",rP?(rP>=0?"+":"-")+"$"+fm(Math.abs(rP)):"$ 0",rP>=0?"#00ddb8":"#f44")+sr("開始日期",st.length?st[0].date:"—","#e0e7f0");
    if(pAt)h+=sr("最後更新",new Date(pAt).toLocaleString("zh-TW"),"#e0e7f0");
    h+=`</div>`;
    // Trades
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:16px 0 10px">交易紀錄（點擊編輯）</div>`;
    st.forEach(t=>{h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.ed={...S.tr.find(x=>x.id==='${t.id}')};initF(S.ed);set({v:'form'})">
      <div style="display:flex;align-items:center;gap:8px"><span class="badge ${t.action==="buy"?"buy-bg":"sell-bg"}">${t.action==="buy"?"買入":"賣出"}</span><span style="font-weight:700">@${fm(t.price)}</span><span style="font-size:12px;color:#7b8da4">×${t.qty}</span></div>
      <span style="font-size:13px;color:#7b8da4">${t.date}</span></div>`});
    h+=`</div></div>`;
    fin(h);return;
  }

  // FORM
  if(S.v==="form"){
    if(S.ed&&!F.id)initF(S.ed);
    h+=`<div class="hdr"><span style="font-weight:700;font-size:17px">${S.ed?"編輯交易":"新增交易"}</span></div>`;
    h+=`<div class="scr"><div class="cnt"><div class="cd" style="padding:20px 18px">`;
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">類型</div><div style="display:flex;gap:8px;margin-bottom:14px">`;
    h+=`<button class="tg ${F.type==="stock"?"on":""}" onclick="setFType('stock')">📈 股票</button><button class="tg ${F.type==="crypto"?"on":""}" onclick="setFType('crypto')">₿ 加密貨幣</button></div>`;
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">操作</div><div style="display:flex;gap:8px;margin-bottom:14px">`;
    h+=`<button class="tg ${F.action==="buy"?"on":""}" onclick="setFAct('buy')">買入</button><button class="tg ${F.action==="sell"?"sell":""}" onclick="setFAct('sell')">賣出</button></div>`;
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">代號</div>`;
    h+=`<input class="inp" id="f_s" value="${esc(F.symbol)}" oninput="updTot()" placeholder="TSLA" style="margin-bottom:14px">`;
    h+=`<div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">單價</div><input class="inp" id="f_p" type="number" step="any" value="${F.price}" oninput="updTot()" placeholder="0"></div>`;
    h+=`<div style="flex:1"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">數量</div><input class="inp" id="f_q" type="number" step="any" value="${F.qty}" oninput="updTot()" placeholder="0"></div></div>`;
    const tot=(+F.price||0)*(+F.qty||0);
    h+=`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1e2d45;margin-bottom:14px"><span style="color:#7b8da4">總金額</span><span id="ftot" style="color:#00ddb8;font-size:20px;font-weight:700">$${fm(tot)}</span></div>`;
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">日期</div><input class="inp" id="f_d" type="date" value="${F.date}" style="margin-bottom:14px">`;
    const canSave=F.symbol&&F.price&&F.qty&&+F.price>0&&+F.qty>0;
    h+=`<div style="display:flex;gap:10px;margin-top:10px"><button class="bs" onclick="S.ed=null;initF();set({v:'home'})">取消</button><button class="bp" id="sbtn" onclick="submitF()" ${canSave?"":"disabled"}>${S.ed?"更新":"儲存"}</button></div>`;
    h+=`</div></div></div>`;
    h+=nav("form");fin(h);return;
  }

  // HEADER
  h+=`<div class="hdr"><div style="display:flex;align-items:center;gap:8px"><span style="color:#00ddb8;font-size:20px">◇</span><span style="font-weight:700;font-size:17px">Portfolio Tracker</span></div>`;
  h+=`<button class="rfb" onclick="fetchPrices(false)">${S.pLoading?"⏳":"🔄"} 更新報價</button></div>`;
  if(S.lastUp)h+=`<div class="pst"><span class="dot"></span>${S.pLoading?"更新中...":"更新於 "+timeAgo(S.lastUp)}</div>`;

  h+=`<div class="scr"><div class="cnt">`;

  if(S.v==="home"){
    if(!S.tr.length){
      h+=`<div style="text-align:center;padding:60px 20px"><div style="font-size:48px;margin-bottom:16px">📊</div><div style="font-weight:600;font-size:20px;margin-bottom:8px">開始追蹤投資</div><div style="color:#7b8da4;font-size:14px;margin-bottom:24px">記錄交易，追蹤盈虧</div><button class="bp" style="max-width:200px" onclick="S.tr=SAM.map(x=>({...x}));sv(TK,S.tr);toast('範例已載入');render();setTimeout(()=>fetchPrices(true),500)">載入範例</button></div>`;
    } else {
      const tMV=pf.op.reduce((s,x)=>{const p=gp(x.s);return s+(p?p*x.q:x.c)},0);
      const tU=pf.op.reduce((s,x)=>{const p=gp(x.s);return s+(p?(p-x.avg)*x.q:0)},0);
      h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">`;
      h+=sc("持倉市值","$"+fm(tMV),"#5b9cf5")+sc("未實現盈虧",(tU>=0?"+":"-")+"$"+fm(Math.abs(tU)),tU>=0?"#00ddb8":"#f44");
      h+=sc("已實現盈虧",(pf.tp>=0?"+":"-")+"$"+fm(Math.abs(pf.tp)),pf.tp>=0?"#00ddb8":"#f44")+sc("持倉成本","$"+fm(pf.tc),"#a48bf5");
      h+=`</div>`;
      h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">持倉（點擊查看詳情）</div>`;
      pf.op.forEach(x=>{
        const p=gp(x.s),mV=p?p*x.q:null,u=p?(p-x.avg)*x.q:null,rt=p?((p-x.avg)/x.avg)*100:null,pc=u!=null?(u>=0?"#00ddb8":"#f44"):"#7b8da4";
        h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.det='${x.s}';S.pv='';set({v:'det'})">
          <div><div style="font-weight:700;font-size:15px">${x.s}</div><div style="font-size:12px;color:#7b8da4;margin-top:2px">${x.q} 股 · 均價 $${fm(x.avg)}</div></div>
          <div style="text-align:right"><div style="font-weight:700;color:${pc}">${mV!=null?"$"+fm(mV):"$"+fm(x.c)}</div><div style="font-size:12px;color:${pc}">${rt!=null?(rt>=0?"+":"")+fm(rt)+"%":"輸入報價 ›"}</div></div></div>`;
      });
      if(pf.cl.length){
        h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:20px 0 12px">已平倉</div>`;
        pf.cl.forEach(c=>{const g=c.pnl>=0,cl=g?"#00ddb8":"#f44";
          h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center">
            <div><div style="font-weight:700">${c.s}</div><div style="font-size:12px;color:#7b8da4">賣出 ${c.qty} @ $${fm(c.price)} · ${c.date}</div></div>
            <div style="text-align:right"><div style="font-weight:700;color:${cl}">${g?"+":"-"}$${fm(Math.abs(c.pnl))}</div>${c.cb>0?`<div style="font-size:12px;color:${cl}">${(c.pnl/c.cb*100>=0)?"+":""}${fm(c.pnl/c.cb*100)}%</div>`:""}</div></div>`;
        });
      }
    }
  } else {
    // TRADES
    h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">交易紀錄 (${S.tr.length})</div>`;
    [...S.tr].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(t=>{
      const buy=t.action==="buy";
      h+=`<div class="cd" style="display:flex;align-items:center;gap:10px">
        <div style="width:3px;height:32px;border-radius:2px;background:${buy?"#00ddb8":"#f44"}"></div>
        <div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:2px">
          <span class="badge ${buy?"buy-bg":"sell-bg"}">${buy?"買入":"賣出"}</span>
          <span style="font-weight:700">${t.symbol}</span><span style="color:#7b8da4;font-size:13px">@${fm(t.price)}</span></div>
          <div style="font-size:12px;color:#7b8da4">${t.qty} 股 · $${fm(t.qty*t.price)} · ${t.date}</div></div>
        <button onclick="S.ed={...S.tr.find(x=>x.id==='${t.id}')};initF(S.ed);set({v:'form'})" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">✏️</button>
        <button onclick="set({del:S.tr.find(x=>x.id==='${t.id}')})" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">🗑</button></div>`;
    });
  }
  h+=`</div></div>`;
  h+=nav(S.v);

  if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
  if(S.del)h+=`<div class="modal" onclick="if(event.target===this)set({del:null})"><div class="cd" style="padding:24px;max-width:360px"><div style="font-weight:600;margin-bottom:12px">刪除此交易？</div><div style="display:flex;gap:10px"><button class="bs" onclick="set({del:null})">取消</button><button class="bp" style="background:linear-gradient(135deg,#f44,#c33)" onclick="S.tr=S.tr.filter(x=>x.id!==S.del.id);S.del=null;sv(TK,S.tr);toast('已刪除');render()">刪除</button></div></div></div>`;

  fin(h);
}

function fin(h){document.getElementById("app").innerHTML=h}
function nav(v){return`<div class="nav"><button class="nb ${v==="home"?"on":""}" onclick="S.ed=null;initF();set({v:'home'})"><span style="font-size:18px">💼</span>總覽</button><button class="fab" onclick="S.ed=null;initF();set({v:'form'})">+</button><button class="nb ${v==="trades"?"on":""}" onclick="S.ed=null;initF();set({v:'trades'})"><span style="font-size:18px">📋</span>交易</button></div>`}
function sc(l,v,c){return`<div class="cd" style="border-left:3px solid ${c}"><div style="font-size:12px;color:#7b8da4;margin-bottom:6px">${l}</div><div style="font-size:18px;font-weight:700;color:${c}">${v}</div></div>`}
function sr(l,v,c){return`<div class="sr"><span style="font-size:14px;color:#7b8da4">${l}</span><span style="font-weight:600;font-size:15px;color:${c}">${v}</span></div>`}
function timeAgo(d){const m=Math.round((Date.now()-d.getTime())/6e4);return m<1?"剛剛":m<60?m+"分鐘前":Math.floor(m/60)+"小時前"}

render();
setTimeout(()=>fetchPrices(true),1000);
setInterval(()=>fetchPrices(true),30*60*1000);
</script>
</body>
</html>
