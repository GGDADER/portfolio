<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#0b1120">
<title>Portfolio Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,'SF Pro Display','Noto Sans TC',system-ui,sans-serif;background:#0b1120;color:#e0e7f0;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.hdr{padding:14px 20px;border-bottom:1px solid #1e2d45;background:rgba(11,17,32,.95);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;z-index:20}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.cnt{padding:16px 20px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:10px 20px 14px;background:linear-gradient(to top,#0b1120 60%,transparent);z-index:20}
@supports(padding:env(safe-area-inset-bottom)){.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.hdr{padding-top:calc(14px + env(safe-area-inset-top))}}
.nb{background:0;border:0;color:#7b8da4;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 16px;font-family:inherit}
.nb.on{color:#00ddb8}
.fab{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00ddb8,#00bb9a);border:0;color:#0b1120;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 4px 20px rgba(0,221,184,.25)}
.fab:active{transform:scale(.93)}
.cd{background:#131c2e;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.inp{width:100%;background:#0b1120;border:1px solid #1e2d45;border-radius:10px;padding:11px 14px;color:#e0e7f0;font-size:15px;outline:0;font-family:inherit;box-sizing:border-box}
.inp:focus{border-color:#00ddb8}
.bp{flex:1;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#00ddb8,#00bb9a);color:#0b1120;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bp:disabled{opacity:.4}
.bs{flex:1;padding:12px;border-radius:12px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-size:15px;cursor:pointer;font-family:inherit}
.bd{padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#f44,#c33);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.tg{flex:1;padding:10px;border-radius:10px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.tg.on{background:rgba(0,221,184,.12);color:#00ddb8;border-color:#00ddb8}
.tg.sell{background:rgba(255,68,68,.12);color:#f44;border-color:#f44}
.tg.tw{background:rgba(251,191,36,.12);color:#fbbf24;border-color:#fbbf24}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.buy-bg{background:rgba(0,221,184,.12);color:#00ddb8}
.sell-bg{background:rgba(255,68,68,.12);color:#f44}
.tw-bg{background:rgba(251,191,36,.12);color:#fbbf24}
.sr{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e2d45}
.sr:last-child{border-bottom:0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#131c2e;border:1px solid #00ddb8;color:#00ddb8;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;pointer-events:none;animation:fadeout .3s 1.8s forwards}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.rfb{background:rgba(0,221,184,.12);border:1px solid rgba(0,221,184,.2);color:#00ddb8;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.ccb{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.2);color:#fbbf24;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.hb{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);color:#a48bf5;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.sb{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.2);color:#60a5fa;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.pst{display:flex;align-items:center;gap:6px;justify-content:center;padding:6px;font-size:11px;color:#7b8da4;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:#00ddb8}
.sdot{width:6px;height:6px;border-radius:50%}
.blur{filter:blur(8px);user-select:none;-webkit-user-select:none}
.ctp{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #1e2d45;background:0;color:#7b8da4;font-family:inherit;margin:0 2px 4px}
.ctp.on{background:rgba(0,221,184,.12);color:#00ddb8;border-color:#00ddb8}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var FK=ld("pt_fk","");
var GS=ld("pt_gs","");
var TK="pt_t9",PK="pt_p9",CK="pt_cur",HK="pt_hist9";
function ld(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,8)}
function fm(n){return n!=null&&!isNaN(n)?Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"}
function fmTW(n){return n!=null&&!isNaN(n)?Math.round(n).toLocaleString():"—"}
function isTW(s){return/^\d{4,6}$/.test(s)}

var S={tr:ld(TK,[]),pr:ld(PK,{}),v:"home",ed:null,det:null,toast:null,tt:null,del:null,pv:"",pLoading:false,lastUp:null,cur:ld(CK,"USD"),modal:null,rate:ld("pt_rate",32.5),hide:ld("pt_hide",false),synced:false,syncing:false,chartRange:"1M",chartCustom:null,hiddenSyms:ld("pt_hidden",[])};

/* Startup: purge invalid trades */
(function(){var c=[],d=false;for(var i=0;i<S.tr.length;i++){var t=S.tr[i];if(t&&t.id&&t.symbol&&String(t.symbol).replace(/\s/g,"")!==""&&t.price!=null&&t.qty!=null&&t.qty>0){c.push(t)}else{d=true}}if(d){S.tr=c;sv(TK,S.tr)}})();

function cfgOk(){return FK&&GS&&FK.length>5&&GS.length>10}
function saveCfg(){
  var fk=document.getElementById("cfg_fk");var gs=document.getElementById("cfg_gs");
  if(fk)FK=fk.value.trim();if(gs)GS=gs.value.trim();
  sv("pt_fk",FK);sv("pt_gs",GS);
  if(cfgOk()){toast("設定已儲存 ✓");render()}else{toast("請填入完整設定")}
}
function clearCfg(){if(confirm("確定要清除所有設定和資料？\n這會刪除本機所有交易、報價、歷史紀錄。")){localStorage.clear();FK="";GS="";S.tr=[];S.pr={};render()}}

function renderSetup(){
  var h='<div class="hdr"><div style="display:flex;align-items:center;gap:8px"><span style="color:#00ddb8;font-size:20px">◇</span><span style="font-weight:700;font-size:17px">Portfolio</span></div>';
  if(cfgOk())h+='<button class="rfb" onclick="S.v=\'home\';render()">← 返回</button>';
  h+='</div><div class="scr"><div class="cnt">';

  if(!cfgOk()){
    h+='<div style="text-align:center;padding:30px 0 20px"><div style="font-size:48px;margin-bottom:12px">🔐</div><div style="font-weight:700;font-size:20px;margin-bottom:6px">首次設定</div><div style="color:#7b8da4;font-size:13px">只需設定一次，資料儲存在你的瀏覽器中</div></div>';
  }

  h+='<div class="cd" style="padding:18px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">⚙️ API 設定</div>';
  h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">Finnhub API Key</div>';
  h+='<input class="inp" id="cfg_fk" value="'+esc(FK)+'" placeholder="你的 Finnhub API Key" style="margin-bottom:12px">';
  h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">Google Apps Script URL</div>';
  h+='<input class="inp" id="cfg_gs" value="'+esc(GS)+'" placeholder="你的 GAS 部署 URL" style="margin-bottom:14px">';
  h+='<button class="bp" style="width:100%" onclick="saveCfg()">💾 儲存設定</button>';
  h+='</div>';

  /* Setup Guide */
  h+='<div class="cd" style="padding:18px;margin-top:8px"><div style="font-size:15px;font-weight:700;margin-bottom:12px">📖 設定教學</div>';

  h+='<div style="margin-bottom:16px"><div style="font-weight:700;color:#00ddb8;margin-bottom:6px">步驟 1：取得 Finnhub API Key（免費）</div>';
  h+='<div style="font-size:13px;color:#7b8da4;line-height:1.6">';
  h+='1. 前往 <span style="color:#60a5fa">finnhub.io</span> 註冊帳號<br>';
  h+='2. 登入後在 Dashboard 頁面即可看到 API Key<br>';
  h+='3. 複製 API Key 貼到上方欄位<br>';
  h+='<span style="color:#fbbf24">💡 免費方案每分鐘 60 次呼叫，個人使用綽綽有餘</span></div></div>';

  h+='<div style="margin-bottom:16px"><div style="font-weight:700;color:#00ddb8;margin-bottom:6px">步驟 2：部署 Google Apps Script（免費）</div>';
  h+='<div style="font-size:13px;color:#7b8da4;line-height:1.6">';
  h+='1. 前往 <span style="color:#60a5fa">sheets.new</span> 建立新的 Google Sheet<br>';
  h+='2. 選單 → 擴充功能 → Apps Script<br>';
  h+='3. 清空預設程式碼，貼上以下程式碼<br>';
  h+='4. 點擊「部署」→「新增部署」<br>';
  h+='5. 類型選「網頁應用程式」<br>';
  h+='6. 執行身分選「我」，存取權選「任何人」<br>';
  h+='7. 部署後複製 URL 貼到上方欄位</div></div>';

  h+='<div style="font-weight:700;color:#fbbf24;margin-bottom:8px">📋 Apps Script 程式碼（點擊複製）</div>';
  h+='<div onclick="copyGAS()" style="background:#0b1120;border:1px solid #1e2d45;border-radius:8px;padding:12px;font-size:11px;color:#7b8da4;cursor:pointer;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-family:monospace;line-height:1.5" id="gasCode">';
  h+=esc(gasCode());
  h+='</div>';
  h+='<div style="font-size:11px;color:#7b8da4;margin-top:6px;text-align:center">👆 點擊上方程式碼區塊即可複製</div>';
  h+='</div>';

  if(cfgOk()){
    h+='<div class="cd" style="padding:18px;margin-top:8px"><div style="font-size:15px;font-weight:700;margin-bottom:12px;color:#f44">⚠️ 危險區域</div>';
    h+='<button class="bd" onclick="clearCfg()">🗑 清除所有設定和資料</button>';
    h+='</div>';
  }

  h+='</div></div>';
  return h;
}

function gasCode(){
  return "var SHEET_NAME = 'Data';\n\nfunction doGet(e) {\n  var action = (e.parameter.action || '').toString();\n  if (action === 'read') return readData();\n  if (action === 'twprice') return getTWPrice(e.parameter.sym);\n  return jsonOut({ok:false});\n}\n\nfunction doPost(e) {\n  try {\n    var d = JSON.parse(e.postData.contents);\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sh = ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);\n    sh.clear();\n    sh.getRange('A1').setValue(d.trades || '[]');\n    sh.getRange('B1').setValue(d.prices || '{}');\n    sh.getRange('C1').setValue(d.history || '[]');\n    return jsonOut({ok:true});\n  } catch(err) { return jsonOut({ok:false,e:err.message}); }\n}\n\nfunction readData() {\n  try {\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sh = ss.getSheetByName(SHEET_NAME);\n    if (!sh) return jsonOut({ok:false,msg:'no sheet'});\n    var trades = sh.getRange('A1').getValue();\n    var prices = sh.getRange('B1').getValue();\n    var history = sh.getRange('C1').getValue();\n    return jsonOut({ok:true,trades:trades,prices:prices,history:history||'[]'});\n  } catch(err) { return jsonOut({ok:false,e:err.message}); }\n}\n\nfunction getTWPrice(sym) {\n  try {\n    var url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_' + sym + '.tw';\n    var r = JSON.parse(UrlFetchApp.fetch(url).getContentText());\n    var d = r.msgArray && r.msgArray[0];\n    var p = d ? parseFloat(d.z) || parseFloat(d.y) : 0;\n    var y = d ? parseFloat(d.y) : 0;\n    return jsonOut({ok:true,price:p,yesterday:y});\n  } catch(err) { return jsonOut({ok:false,price:0}); }\n}\n\nfunction jsonOut(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}";
}

function copyGAS(){
  var code=gasCode();
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(function(){toast("已複製程式碼 ✓")}).catch(function(){fallbackCopy(code)})}else{fallbackCopy(code)}
}
function fallbackCopy(t){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已複製程式碼 ✓")}catch(e){toast("複製失敗，請手動選取")}document.body.removeChild(a)}

function set(p){for(var k in p)S[k]=p[k];sv(TK,S.tr);render()}
function toast(m){if(S.tt)clearTimeout(S.tt);S.toast=m;S.tt=setTimeout(function(){S.toast=null;render()},2000);render()}
function toDisp(v,cur){return S.cur==="TWD"?(cur==="TWD"?v:v*S.rate):(cur==="TWD"?v/S.rate:v)}
function ds(){return S.cur==="TWD"?"NT$":"$"}
function dfm(v){return S.cur==="TWD"?fmTW(v):fm(v)}
function H(v){return S.hide?'<span class="blur">'+v+'</span>':v}
function gp(s){return S.pr[s]?S.pr[s].p:null}
function esc(s){return String(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

/* Cloud: manual upload */
function cloudSave(){
  if(!GS){toast("請先設定 Google Apps Script URL");return}
  S.syncing=true;render();
  var hist=ld(HK,[]);
  fetch(GS,{method:"POST",body:JSON.stringify({trades:JSON.stringify(S.tr),prices:JSON.stringify(S.pr),history:JSON.stringify(hist)})}).then(function(){S.synced=true;S.syncing=false;toast("已上傳至雲端 ✓")}).catch(function(){S.syncing=false;toast("上傳失敗");render()});
}
/* Cloud: manual download — FULL REPLACE, no merge */
function cloudLoad(){
  if(!GS){toast("請先設定 Google Apps Script URL");return}
  S.syncing=true;render();
  fetch(GS+"?action=read").then(function(r){return r.json()}).then(function(d){
    if(d.ok&&d.trades){try{
      var ct=JSON.parse(d.trades);var cp=d.prices?JSON.parse(d.prices):{};
      if(Array.isArray(ct)){
        var valid=[];
        for(var i=0;i<ct.length;i++){var t=ct[i];if(!t||!t.id)continue;if(!t.symbol||String(t.symbol).replace(/\s/g,"")==="")continue;if(!t.action)t.action="buy";if(!t.price&&t.price!==0)t.price=0;if(!t.qty&&t.qty!==0)t.qty=0;if(t.qty<=0)continue;if(!t.date)t.date="2025-01-01";if(!t.cur)t.cur=isTW(t.symbol)?"TWD":"USD";if(!t.type)t.type="stock";valid.push(t)}
        S.tr=valid;for(var k in cp)S.pr[k]=cp[k];sv(TK,S.tr);sv(PK,S.pr);
        /* Also restore history if present */
        if(d.history){try{var ch=JSON.parse(d.history);if(Array.isArray(ch)&&ch.length)sv(HK,ch)}catch(e){}}
      }
      S.synced=true;toast("已從雲端下載 ✓")}catch(e){toast("雲端資料解析失敗")}}else{toast("雲端無資料")}
    S.syncing=false;render();
  }).catch(function(){S.syncing=false;toast("下載失敗");render()});
}
function saveLocal(){sv(TK,S.tr);sv(PK,S.pr)}

function calc(){
  var p={},cl=[];
  var sorted=S.tr.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  for(var i=0;i<sorted.length;i++){var t=sorted[i];if(!t.symbol)continue;
    var tw=t.cur==="TWD",mul=tw?1000:1;
    if(!p[t.symbol])p[t.symbol]={s:t.symbol,tp:t.type,cur:t.cur||"USD",q:0,c:0,bs:[]};var P=p[t.symbol];
    var cost=t.price*t.qty*mul;
    if(t.action==="buy"){P.q+=t.qty;P.c+=cost;P.bs.push({p:t.price*mul,r:t.qty})}
    else{var r=t.qty,cb=0;while(r>0&&P.bs.length){var b=P.bs[0],k=Math.min(r,b.r);cb+=k*b.p;r-=k;b.r-=k;if(b.r<=0)P.bs.shift()}P.q-=t.qty;P.c-=cb;cl.push({s:t.symbol,cur:t.cur||"USD",pnl:t.price*t.qty*mul-cb,qty:t.qty,price:t.price,date:t.date||"",cb:cb})}}
  var op=[];for(var k in p){if(p[k].q>0)op.push({s:p[k].s,tp:p[k].tp,cur:p[k].cur,q:p[k].q,avg:p[k].c/p[k].q,c:p[k].c})}
  return{op:op,cl:cl};
}

function fetchOne(sym){
  if(isTW(sym)){if(!GS)return Promise.resolve(null);return fetch(GS+"?action=twprice&sym="+sym).then(function(r){return r.json()}).then(function(d){return d.ok&&d.price>0?{p:d.price,pc:d.yesterday||null}:null}).catch(function(){return null})}
  if(!FK)return Promise.resolve(null);
  return fetch("https://finnhub.io/api/v1/quote?symbol="+sym+"&token="+FK).then(function(r){return r.json()}).then(function(d){return d.c>0?{p:d.c,pc:d.pc||null}:null}).catch(function(){return null})
}
function fetchRate(){return fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(d){if(d.rates&&d.rates.TWD){S.rate=d.rates.TWD;sv("pt_rate",S.rate)}}).catch(function(){})}
function fetchPrices(silent){
  var pf=calc();if(!pf.op.length)return;
  if(!silent){S.pLoading=true;render()}
  fetchRate().then(function(){
    var chain=Promise.resolve();var np={};for(var k in S.pr)np[k]=S.pr[k];var ok=0;
    for(var i=0;i<pf.op.length;i++){(function(pos){chain=chain.then(function(){return fetchOne(pos.s).then(function(r){if(r&&r.p){np[pos.s]={p:r.p,pc:r.pc,at:Date.now()};ok++}}).then(function(){return new Promise(function(re){setTimeout(re,400)})})})})(pf.op[i])}
    chain.then(function(){S.pr=np;S.pLoading=false;S.lastUp=new Date();sv(PK,np);snapHistory();if(!silent)toast(ok?"已更新 "+ok+" 檔報價 ✓":"更新失敗");else render()})
  })
}

/* History snapshots for chart - store raw values per currency, exclude hidden */
/* Always overwrite today's snapshot with latest values */
function snapHistory(){
  var hist=ld(HK,[]);var pf=calc();var usd=0,twd=0;
  for(var i=0;i<pf.op.length;i++){
    var x=pf.op[i],p=gp(x.s),tw=x.cur==="TWD";
    if(isHidden(x.s))continue;
    var mv=p?p*x.q*(tw?1000:1):x.c;
    if(tw){twd+=mv}else{usd+=mv}
  }
  var today=new Date().toISOString().slice(0,10);
  var found=false;
  for(var i=0;i<hist.length;i++){if(hist[i].d===today){hist[i]={d:today,u:usd,t:twd,r:S.rate||32.5};found=true;break}}
  if(!found)hist.push({d:today,u:usd,t:twd,r:S.rate||32.5});
  if(hist.length>365)hist=hist.slice(hist.length-365);
  sv(HK,hist);render();
}
function histVal(h){
  /* Convert a snapshot to display currency using the rate at time of snapshot */
  var r=h.r||S.rate||32.5;
  if(S.cur==="TWD"){return(h.u||0)*r+(h.t||0)}
  else{return(h.u||0)+(h.t||0)/r}
}
function getHistRange(range,cf,ct){
  var hist=ld(HK,[]);if(!hist.length)return[];
  /* migrate old format: if entry has .v but no .u, convert */
  for(var i=0;i<hist.length;i++){
    if(hist[i].v!=null&&hist[i].u==null){hist[i].u=hist[i].v;hist[i].t=0;hist[i].r=S.rate||32.5;delete hist[i].v}
  }
  var out=[];for(var i=0;i<hist.length;i++){out.push({d:hist[i].d,v:histVal(hist[i])})}
  var now=new Date();var from;
  if(range==="custom"&&cf){from=new Date(cf);var to=ct?new Date(ct):now;return out.filter(function(h){var d=new Date(h.d);return d>=from&&d<=to})}
  if(range==="7D"){from=new Date(now);from.setDate(from.getDate()-7)}
  else if(range==="1M"){from=new Date(now);from.setMonth(from.getMonth()-1)}
  else if(range==="3M"){from=new Date(now);from.setMonth(from.getMonth()-3)}
  else if(range==="6M"){from=new Date(now);from.setMonth(from.getMonth()-6)}
  else if(range==="YTD"){from=new Date(now.getFullYear(),0,1)}
  else return out;
  return out.filter(function(h){return new Date(h.d)>=from})
}

function renderChart(data,w,ht){
  if(!data||data.length<2)return'<div style="text-align:center;color:#7b8da4;padding:30px 0;font-size:13px">需要至少 2 天數據才能繪製圖表<br><span style="font-size:11px">每次更新報價時自動記錄</span></div>';
  var pad=50,pr=10,pt=20,pb=10,cw=w-pad-pr,ch=ht-pt-pb;
  var vals=[];for(var i=0;i<data.length;i++)vals.push(data[i].v);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mn===mx){mn*=.99;mx*=1.01}
  var pts=[];for(var i=0;i<data.length;i++){var x=pad+(i/(data.length-1))*cw;var y=pt+ch-(((data[i].v-mn)/(mx-mn))*ch);pts.push({x:x,y:y})}
  var path="";for(var i=0;i<pts.length;i++)path+=(i===0?"M":"L")+pts[i].x.toFixed(1)+","+pts[i].y.toFixed(1);
  var first=data[0].v,last=data[data.length-1].v,chg=last-first,chgP=first>0?((last-first)/first*100):0,isUp=chg>=0,col=isUp?"#00ddb8":"#f44",D=ds();
  var fill=path+"L"+pts[pts.length-1].x.toFixed(1)+","+(pt+ch)+"L"+pts[0].x.toFixed(1)+","+(pt+ch)+"Z";
  var s='<svg width="100%" viewBox="0 0 '+w+' '+ht+'" preserveAspectRatio="xMidYMid meet" style="display:block">';
  s+='<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'" stop-opacity="0.25"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0.02"/></linearGradient></defs>';
  for(var g=0;g<=3;g++){var gy=pt+(ch/3)*g;s+='<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(pad+cw)+'" y2="'+gy.toFixed(1)+'" stroke="#1e2d45" stroke-width="0.5"/>';var gv=mx-((mx-mn)/3)*g;s+='<text x="'+(pad-4)+'" y="'+(gy+4).toFixed(1)+'" fill="#7b8da4" font-size="9" text-anchor="end">'+dfm(gv)+'</text>'}
  s+='<path d="'+fill+'" fill="url(#cg)"/><path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  var fl=pts[0],ll=pts[pts.length-1];
  s+='<circle cx="'+fl.x.toFixed(1)+'" cy="'+fl.y.toFixed(1)+'" r="3.5" fill="'+col+'"/>';
  s+='<circle cx="'+ll.x.toFixed(1)+'" cy="'+ll.y.toFixed(1)+'" r="3.5" fill="'+col+'"/>';
  s+='<text x="'+fl.x.toFixed(1)+'" y="'+(pt+ch+12)+'" fill="#7b8da4" font-size="8" text-anchor="start">'+data[0].d.slice(5)+'</text>';
  s+='<text x="'+ll.x.toFixed(1)+'" y="'+(pt+ch+12)+'" fill="#7b8da4" font-size="8" text-anchor="end">'+data[data.length-1].d.slice(5)+'</text>';
  s+='</svg>';
  var hd='<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px"><div><div style="font-size:11px;color:#7b8da4">資產變化</div><div style="font-size:20px;font-weight:700;color:'+col+'">'+(isUp?"+":"")+D+dfm(chg)+'</div><div style="font-size:13px;color:'+col+'">'+(isUp?"+":"")+fm(chgP)+'%</div></div><div style="text-align:right"><div style="font-size:11px;color:#7b8da4">最新</div><div style="font-size:15px;font-weight:600">'+H(D+dfm(last))+'</div></div></div>';
  return hd+s;
}

      h+='<button class="ctp'+(S.chartRange==="custom"?" on":"")+'" onclick="S.chartRange=\'custom\';if(!S.chartCustom)S.chartCustom={};render()">自定義</button></div>';
      if(S.chartRange==="custom"){var ccf=S.chartCustom&&S.chartCustom.from||"",cct=S.chartCustom&&S.chartCustom.to||"";h+='<div style="display:flex;gap:8px;margin-bottom:10px"><input type="date" class="inp" style="flex:1;font-size:12px;padding:8px" value="'+ccf+'" onchange="if(!S.chartCustom)S.chartCustom={};S.chartCustom.from=this.value;render()"><input type="date" class="inp" style="flex:1;font-size:12px;padding:8px" value="'+cct+'" onchange="if(!S.chartCustom)S.chartCustom={};S.chartCustom.to=this.value;render()"></div>'}
      var cd=getHistRange(S.chartRange,S.chartCustom?S.chartCustom.from:null,S.chartCustom?S.chartCustom.to:null);
      h+=renderChart(cd,440,180);
      h+='</div>';
      h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">持倉（點擊查看詳情）</div>';
      for(var i=0;i<pf.op.length;i++){var x=pf.op[i];if(isHidden(x.s))continue;var p=gp(x.s);var tw=x.cur==="TWD";var ps=tw?"NT$":"$";var f=tw?fmTW:fm;
        var avgPS=tw?x.avg/1000:x.avg,mV=p?p*x.q*(tw?1000:1):null,u=p?(p*(tw?1000:1)-x.avg)*x.q:null,rt=p?((p*(tw?1000:1)-x.avg)/x.avg)*100:null,pc=u!=null?(u>=0?"#00ddb8":"#f44"):"#7b8da4";
        var cpStr="";
        if(p){
          var prData=S.pr[x.s];var pcv=prData&&prData.pc?prData.pc:null;
          var dayChg=pcv?(p-pcv):null;var dayPct=pcv&&pcv>0?((p-pcv)/pcv*100):null;
          var dcCol=dayChg!=null?(dayChg>=0?"#00ddb8":"#f44"):"#5b9cf5";
          cpStr='<span style="color:'+dcCol+';font-size:11px;margin-left:4px">📍'+ps+f(p);
          if(dayChg!=null)cpStr+=' <span style="font-size:10px">'+(dayChg>=0?"+":"")+fm(dayChg)+'('+(dayPct>=0?"+":"")+fm(dayPct)+'%)</span>';
          cpStr+='</span>';
        }
        h+='<div class="cd" style="display:flex;align-items:center;gap:6px">';
        h+='<div style="flex:1;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.det=\''+x.s+'\';S.pv=\'\';set({v:\'det\'})">';
        h+='<div style="display:flex;align-items:center;gap:10px">'+(tw?'<div style="width:26px;height:26px;border-radius:7px;background:rgba(251,191,36,.12);display:flex;align-items:center;justify-content:center;font-size:11px">🇹🇼</div>':"");
        h+='<div><div style="font-weight:700;font-size:15px">'+x.s+'</div><div style="font-size:12px;color:#7b8da4;margin-top:2px">'+H(x.q+(tw?" 張":" 股"))+' · 均價 '+ps+f(avgPS)+cpStr+'</div></div></div>';
        h+='<div style="text-align:right"><div style="font-weight:700;color:'+pc+'">'+H(u!=null?(u>=0?"+":"-")+ps+f(Math.abs(u)):ps+f(x.c))+'</div><div style="font-size:12px;color:'+pc+'">'+H(rt!=null?(rt>=0?"+":"")+fm(rt)+"%":"輸入報價 ›")+'</div></div></div>';
        h+='<button onclick="event.stopPropagation();toggleHidePos(\''+x.s+'\')" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:12px;padding:4px" title="隱藏此持倉">👁‍🗨</button></div>'}
      /* Hidden positions section */
      var hiddenOps=[];for(var i=0;i<pf.op.length;i++){if(isHidden(pf.op[i].s))hiddenOps.push(pf.op[i])}
      if(hiddenOps.length){
        h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:20px 0 12px;display:flex;justify-content:space-between;align-items:center">已隱藏 ('+hiddenOps.length+')<button onclick="S._showHidden=!S._showHidden;render()" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:12px">'+(S._showHidden?"▲ 收起":"▼ 展開")+'</button></div>';
        if(S._showHidden){for(var i=0;i<hiddenOps.length;i++){var x=hiddenOps[i];var tw=x.cur==="TWD";var ps=tw?"NT$":"$";var f=tw?fmTW:fm;
          h+='<div class="cd" style="display:flex;justify-content:space-between;align-items:center;opacity:.5"><div><div style="font-weight:700">'+x.s+'</div><div style="font-size:12px;color:#7b8da4">'+H(x.q+(tw?" 張":" 股"))+'</div></div><button onclick="toggleHidePos(\''+x.s+'\')" style="background:rgba(0,221,184,.12);border:1px solid rgba(0,221,184,.2);color:#00ddb8;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer">顯示</button></div>'}}
      }
      if(pf.cl.length){h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:20px 0 12px">已平倉</div>';
      for(var i=0;i<pf.cl.length;i++){var c=pf.cl[i];var cSym=c.s||"???",cQty=c.qty||0,cPrice=c.price||0,cDate=c.date||"",g=c.pnl>=0,cl2=g?"#00ddb8":"#f44",tw=c.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
        h+='<div class="cd" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">'+cSym+(tw?' <span class="badge tw-bg">台</span>':"")+'</div><div style="font-size:12px;color:#7b8da4">賣出 '+H(cQty+"")+" @ "+ps+f(cPrice)+" · "+cDate+'</div></div><div style="text-align:right"><div style="font-weight:700;color:'+cl2+'">'+H((g?"+":"-")+ps+f(Math.abs(c.pnl)))+'</div>'+(c.cb>0?'<div style="font-size:12px;color:'+cl2+'">'+H((c.pnl/c.cb*100>=0?"+":"")+fm(c.pnl/c.cb*100)+"%")+'</div>':"")+'</div></div>'}}
    }
  } else {
    h+='<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">交易紀錄 ('+S.tr.length+')</div>';
    var sorted=S.tr.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    for(var i=0;i<sorted.length;i++){var t=sorted[i];var tSym=t.symbol||"???",tPrice=t.price||0,tQty=t.qty||0,buy=t.action==="buy",tw=t.cur==="TWD",ps=tw?"NT$":"$",f=tw?fmTW:fm;
      h+='<div class="cd" style="display:flex;align-items:center;gap:10px"><div style="width:3px;height:32px;border-radius:2px;background:'+(buy?"#00ddb8":"#f44")+'"></div><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:2px"><span class="badge '+(buy?"buy-bg":"sell-bg")+'">'+(buy?"買入":"賣出")+'</span>'+(tw?'<span class="badge tw-bg">台</span>':"")+'<span style="font-weight:700">'+tSym+'</span><span style="color:#7b8da4;font-size:13px">@'+ps+f(tPrice)+'</span></div><div style="font-size:12px;color:#7b8da4">'+H(tQty+(tw?" 張":" 股"))+" · "+H(ps+f(tQty*tPrice*(tw?1000:1)))+" · "+t.date+'</div></div>';
      h+='<button onclick="var t=findTr(\''+t.id+'\');if(t){S.ed=JSON.parse(JSON.stringify(t));initF(S.ed);set({v:\'form\'})}" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">✏️</button>';
      h+='<button onclick="set({del:findTr(\''+t.id+'\')})" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">🗑</button></div>'}
  }
  h+='</div></div>';h+=nav(S.v);
  if(S.toast)h+='<div class="toast">'+S.toast+'</div>';
  if(S.del)h+='<div class="modal" onclick="if(event.target===this)set({del:null})"><div class="cd" style="padding:24px;max-width:360px"><div style="font-weight:600;margin-bottom:12px">刪除此交易？</div><div style="display:flex;gap:10px"><button class="bs" onclick="set({del:null})">取消</button><button class="bd" onclick="S.tr=S.tr.filter(function(x){return x.id!==S.del.id});S.del=null;saveLocal();toast(\'已刪除\');render()">刪除</button></div></div></div>';
  fin(h);
}catch(e){document.getElementById("app").innerHTML='<div style="padding:40px;color:#f44"><b>Error:</b> '+e.message+'</div>'}}

function fin(h){document.getElementById("app").innerHTML=h}
function nav(v){return'<div class="nav"><button class="nb '+(v==="home"?"on":"")+'" onclick="S.ed=null;initF();set({v:\'home\'})"><span style="font-size:18px">💼</span>總覽</button><button class="fab" onclick="S.ed=null;initF();set({v:\'form\'})">+</button><button class="nb '+(v==="trades"?"on":"")+'" onclick="S.ed=null;initF();set({v:\'trades\'})"><span style="font-size:18px">📋</span>交易</button></div>'}
function sc(l,v,c){return'<div class="cd" style="border-left:3px solid '+c+'"><div style="font-size:12px;color:#7b8da4;margin-bottom:6px">'+l+'</div><div style="font-size:18px;font-weight:700;color:'+c+'">'+v+'</div></div>'}
function sr(l,v,c){return'<div class="sr"><span style="font-size:14px;color:#7b8da4">'+l+'</span><span style="font-weight:600;font-size:15px;color:'+c+'">'+v+'</span></div>'}
function timeAgo(d){var m=Math.round((Date.now()-d.getTime())/60000);return m<1?"剛剛":m<60?m+"分鐘前":Math.floor(m/60)+"小時前"}

render();
setTimeout(function(){fetchPrices(true)},2000);
setInterval(function(){fetchPrices(true)},1800000);
</script>
</body>
