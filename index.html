<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#0b1120">
<title>Portfolio Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,'SF Pro Display','Noto Sans TC',system-ui,sans-serif;background:#0b1120;color:#e0e7f0;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.hdr{padding:14px 20px;border-bottom:1px solid #1e2d45;background:rgba(11,17,32,.95);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;z-index:20}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.cnt{padding:16px 20px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:10px 20px 14px;background:linear-gradient(to top,#0b1120 60%,transparent);z-index:20}
@supports(padding:env(safe-area-inset-bottom)){.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.hdr{padding-top:calc(14px + env(safe-area-inset-top))}}
.nb{background:0;border:0;color:#7b8da4;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 16px;font-family:inherit}
.nb.on{color:#00ddb8}
.fab{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00ddb8,#00bb9a);border:0;color:#0b1120;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 4px 20px rgba(0,221,184,.25)}
.fab:active{transform:scale(.93)}
.cd{background:#131c2e;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.inp{width:100%;background:#0b1120;border:1px solid #1e2d45;border-radius:10px;padding:11px 14px;color:#e0e7f0;font-size:15px;outline:0;font-family:inherit;box-sizing:border-box}
.inp:focus{border-color:#00ddb8}
.bp{flex:1;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#00ddb8,#00bb9a);color:#0b1120;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bp:disabled{opacity:.4}
.bs{flex:1;padding:12px;border-radius:12px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-size:15px;cursor:pointer;font-family:inherit}
.bd{padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg,#f44,#c33);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.tg{flex:1;padding:10px;border-radius:10px;border:1px solid #1e2d45;background:0;color:#7b8da4;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.tg.on{background:rgba(0,221,184,.12);color:#00ddb8;border-color:#00ddb8}
.tg.sell{background:rgba(255,68,68,.12);color:#f44;border-color:#f44}
.tg.tw{background:rgba(251,191,36,.12);color:#fbbf24;border-color:#fbbf24}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.buy-bg{background:rgba(0,221,184,.12);color:#00ddb8}
.sell-bg{background:rgba(255,68,68,.12);color:#f44}
.tw-bg{background:rgba(251,191,36,.12);color:#fbbf24}
.sr{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e2d45}
.sr:last-child{border-bottom:0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#131c2e;border:1px solid #00ddb8;color:#00ddb8;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;pointer-events:none;animation:fadeout .3s 1.8s forwards}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.rfb{background:rgba(0,221,184,.12);border:1px solid rgba(0,221,184,.2);color:#00ddb8;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.ccb{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.2);color:#fbbf24;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.hb{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);color:#a48bf5;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.sb{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.2);color:#60a5fa;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.pst{display:flex;align-items:center;gap:6px;justify-content:center;padding:6px;font-size:11px;color:#7b8da4;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:#00ddb8}
.sdot{width:6px;height:6px;border-radius:50%}
.blur{filter:blur(8px);user-select:none;-webkit-user-select:none}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FK="d6fg201r01qjq8n1gv0gd6fg201r01qjq8n1gv10";
const GS="https://script.google.com/macros/s/AKfycbwColvvqWmWK4IFQ8Shu8iT5nyqQdYOyrcLr2tf6Cd384cqPFqoKe7srLu2xHsFPPB7/exec";
const TK="pt_t9",PK="pt_p9",CK="pt_cur";
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const uid=()=>Math.random().toString(36).slice(2,8);
const fm=(n)=>n!=null&&!isNaN(n)?Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
const fmTW=(n)=>n!=null&&!isNaN(n)?Math.round(n).toLocaleString():"—";
const isTW=s=>/^\d{4,6}$/.test(s);

let S={tr:ld(TK,[]),pr:ld(PK,{}),v:“home”,ed:null,det:null,toast:null,tt:null,del:null,pv:””,pLoading:false,lastUp:null,cur:ld(CK,“USD”),modal:null,rate:ld(“pt_rate”,32.5),hide:ld(“pt_hide”,false),synced:false,syncing:false};
const set=p=>{Object.assign(S,p);sv(TK,S.tr);render()};
const toast=m=>{if(S.tt)clearTimeout(S.tt);S.toast=m;S.tt=setTimeout(()=>{S.toast=null;render()},2e3);render()};
function toDisp(v,cur){return S.cur===“TWD”?(cur===“TWD”?v:v*S.rate):(cur===“TWD”?v/S.rate:v)}
function ds(){return S.cur===“TWD”?“NT$”:”$”}
function dfm(v){return S.cur===“TWD”?fmTW(v):fm(v)}
function H(v){return S.hide?`<span class="blur">${v}</span>`:v}
const gp=s=>S.pr[s]?.p||null;
const esc=s=>String(s||””).replace(/”/g,”"”).replace(/</g,”<”);

// ── CLOUD SYNC ──
async function cloudSave(){
S.syncing=true;render();
try{await fetch(GS,{method:“POST”,body:JSON.stringify({trades:JSON.stringify(S.tr),prices:JSON.stringify(S.pr)})});
S.synced=true;S.syncing=false;render()}catch(e){S.syncing=false;render()}
}
async function cloudLoad(){
S.syncing=true;render();
try{const r=await fetch(GS+”?action=read”);if(r.ok){const d=await r.json();if(d.ok){
const ct=d.trades?JSON.parse(d.trades):[];const cp=d.prices?JSON.parse(d.prices):{};
if(ct.length>0){const cids=new Set(ct.map(t=>t.id));const lo=S.tr.filter(t=>!cids.has(t.id));S.tr=[…ct,…lo];S.pr={…S.pr,…cp}}
sv(TK,S.tr);sv(PK,S.pr);S.synced=true;S.syncing=false;if(S.tr.length>0)cloudSave();else render();return}}}catch(e){}
S.syncing=false;render();
}
function saveAll(){sv(TK,S.tr);sv(PK,S.pr);cloudSave()}

// ── CALC ──
// Key fix: for Taiwan stocks, cost = price * qty * 1000 (price is per share, qty is in 張)
function calc(){
const p={},cl=[];
[…S.tr].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{
const tw=t.cur===“TWD”,mul=tw?1000:1;
if(!p[t.symbol])p[t.symbol]={s:t.symbol,tp:t.type,cur:t.cur||“USD”,q:0,c:0,bs:[]};const P=p[t.symbol];
const cost=t.price*t.qty*mul; // total cost of this trade
if(t.action===“buy”){P.q+=t.qty;P.c+=cost;P.bs.push({p:t.price*mul,r:t.qty})} // store per-unit cost as price*mul
else{let r=t.qty,cb=0;while(r>0&&P.bs.length){const b=P.bs[0],k=Math.min(r,b.r);cb+=k*b.p;r-=k;b.r-=k;if(b.r<=0)P.bs.shift()}P.q-=t.qty;P.c-=cb;cl.push({s:t.symbol,cur:t.cur||“USD”,pnl:t.price*t.qty*mul-cb,qty:t.qty,price:t.price,date:t.date,cb})}
});
// avg = total cost / qty, so for TW: avg is cost per 張 (= price per share * 1000)
const op=Object.values(p).filter(x=>x.q>0).map(x=>({s:x.s,tp:x.tp,cur:x.cur,q:x.q,avg:x.c/x.q,c:x.c}));
return{op,cl};
}

async function fetchOne(sym){
if(isTW(sym)){
try{const r=await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${sym}.tw&json=1&delay=0`);
if(r.ok){const d=await r.json();const i=d?.msgArray?.[0];if(i){const p=parseFloat(i.z)||parseFloat(i.y);if(p>0)return p}}}catch{}
try{const r=await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=otc_${sym}.tw&json=1&delay=0`);
if(r.ok){const d=await r.json();const i=d?.msgArray?.[0];if(i){const p=parseFloat(i.z)||parseFloat(i.y);if(p>0)return p}}}catch{}
return null;
}
try{const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FK}`);
if(r.ok){const d=await r.json();if(d.c>0)return d.c}}catch{}
return null;
}
async function fetchRate(){
try{const r=await fetch(“https://open.er-api.com/v6/latest/USD”);
if(r.ok){const d=await r.json();if(d.rates?.TWD){S.rate=d.rates.TWD;sv(“pt_rate”,S.rate)}}}catch{}
}
async function fetchPrices(silent){
const pf=calc();if(!pf.op.length)return;
if(!silent){S.pLoading=true;render()}
await fetchRate();const np={…S.pr};let ok=0;
for(const pos of pf.op){const p=await fetchOne(pos.s);if(p){np[pos.s]={p,at:Date.now()};ok++}await new Promise(r=>setTimeout(r,400))}
S.pr=np;S.pLoading=false;S.lastUp=new Date();sv(PK,np);cloudSave();
if(!silent)toast(ok?`已更新 ${ok} 檔報價 ✓`:“更新失敗，請手動輸入”);else render();
}

let F={type:“stock”,symbol:””,action:“buy”,price:””,qty:””,date:new Date().toISOString().slice(0,10),cur:“USD”};
function initF(t){F=t?{…t}:{type:“stock”,symbol:””,action:“buy”,price:””,qty:””,date:new Date().toISOString().slice(0,10),cur:“USD”}}
function readF(){[“f_s”,“f_p”,“f_q”,“f_d”].forEach(id=>{const el=document.getElementById(id);if(!el)return;const k={f_s:“symbol”,f_p:“price”,f_q:“qty”,f_d:“date”}[id];F[k]=id===“f_s”?el.value.toUpperCase():el.value})}
function updTot(){readF();if(isTW(F.symbol))F.cur=“TWD”;const el=document.getElementById(“ftot”),ps=F.cur===“TWD”?“NT$”:”$”,tw=F.cur===“TWD”;
const tot=(+F.price||0)*(+F.qty||0)*(tw?1000:1);if(el)el.textContent=ps+(tw?fmTW(tot):fm(tot));
const btn=document.getElementById(“sbtn”);if(btn)btn.disabled=!(F.symbol&&F.price&&F.qty&&+F.price>0&&+F.qty>0)}
function setFType(v){readF();F.type=v;render()}
function setFAct(v){readF();F.action=v;render()}
function setFCur(v){readF();F.cur=v;render()}
function submitF(){readF();if(!F.symbol||!F.price||!F.qty)return;
const t={id:F.id||uid(),type:F.type,symbol:F.symbol.toUpperCase(),action:F.action,price:+F.price,qty:+F.qty,date:F.date,cur:F.cur};
if(S.ed)S.tr=S.tr.map(x=>x.id===t.id?t:x);else S.tr=[…S.tr,t];
S.ed=null;S.v=“trades”;saveAll();toast(“已儲存 ✓”);render();setTimeout(()=>fetchPrices(true),500)}
function savePr(){const v=parseFloat(S.pv);if(!S.det||isNaN(v)||v<=0)return;S.pr[S.det]={p:v,at:Date.now()};S.pv=””;saveAll();toast(`${S.det} 報價已更新 ✓`);render()}
function toggleHide(){S.hide=!S.hide;sv(“pt_hide”,S.hide);render()}
function deletePosition(sym){S.tr=S.tr.filter(t=>t.symbol!==sym);S.det=null;S.v=“home”;S.modal=null;saveAll();toast(`${sym} 已刪除`);render()}

function render(){
const app=document.getElementById(“app”),pf=calc();let h=””;

// ── DETAIL ──
if(S.v===“det”&&S.det){
const pos=pf.op.find(x=>x.s===S.det);if(!pos){S.v=“home”;S.det=null;render();return}
const p=gp(S.det),tw=pos.cur===“TWD”,ps=tw?“NT$”:”$”;
// For TW: avg is cost per 張, per-share avg = avg/1000, market value per 張 = price*1000
const avgPerShare=tw?pos.avg/1000:pos.avg;
const mV=p?p*pos.q*(tw?1000:1):null;
const u=p?(p*(tw?1000:1)-pos.avg)*pos.q:null;
const rt=p?((p*(tw?1000:1)-pos.avg)/pos.avg)*100:null;
const pc=u!=null?(u>=0?”#00ddb8”:”#f44”):”#7b8da4”;
const rP=pf.cl.filter(c=>c.s===S.det).reduce((s,c)=>s+c.pnl,0);
const st=S.tr.filter(t=>t.symbol===S.det).sort((a,b)=>new Date(a.date)-new Date(b.date));
const pAt=S.pr[S.det]?.at,f=tw?fmTW:fm,un=tw?“張”:“股”;
h+=`<div class="hdr"><button onclick="set({v:'home',det:null})" style="background:0;border:0;color:#7b8da4;font-size:18px;cursor:pointer">‹ 返回</button><button class="hb" onclick="toggleHide()">${S.hide?"👁 顯示":"🙈 隱藏"}</button></div>`;
h+=`<div class="scr"><div class="cnt">`;
h+=`<div style="text-align:center;padding:0 0 24px"><div style="font-size:32px;font-weight:800">${S.det}</div>`;
if(tw)h+=`<div style="font-size:11px;color:#fbbf24;margin-top:4px">🇹🇼 台股（台幣計價）· 1張=1000股</div>`;
h+=`<div style="font-size:22px;color:#7b8da4;margin-top:6px">${H(mV!=null?ps+f(mV):"尚未設定報價")}</div>`;
if(rt!=null)h+=`<div style="font-size:15px;color:${pc};margin-top:4px">${H((rt>=0?"+":"")+fm(rt)+"%")}</div>`;
h+=`</div>`;
h+=`<div class="cd" style="padding:16px;margin-bottom:16px"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:8px">更新報價 (${ps}每股)</div><div style="display:flex;gap:8px"><input type="number" step="any" class="inp" style="flex:1" value="${esc(S.pv)}" oninput="S.pv=this.value" placeholder="${p||'輸入'}"><button class="bp" style="flex:none;padding:10px 16px" onclick="savePr()">更新</button></div></div>`;
h+=`<div class="cd" style="padding:0;overflow:hidden">`;
h+=sr(“每股價格”,H(p?ps+f(p):“未設定”),”#e0e7f0”);
h+=sr(“數量”,H(pos.q+” “+un+(tw?” (”+fmTW(pos.q*1000)+“股)”:””)),”#e0e7f0”);
h+=sr(“報酬率”,H(rt!=null?(rt>=0?”+”:””)+fm(rt)+”%”:”—”),pc);
h+=sr(“每股成本”,ps+f(avgPerShare),”#e0e7f0”);
h+=sr(“總成本”,H(ps+f(pos.c)),”#e0e7f0”);
h+=sr(“損益”,H(u!=null?(u>=0?”+”:”-”)+ps+f(Math.abs(u)):”—”),pc);
h+=sr(“已實現損益”,H(rP?(rP>=0?”+”:”-”)+ps+f(Math.abs(rP)):ps+“0”),rP>=0?”#00ddb8”:”#f44”);
if(pAt)h+=sr(“更新時間”,new Date(pAt).toLocaleString(“zh-TW”),”#e0e7f0”);
h+=`</div>`;
// Trade list for this symbol
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:16px 0 10px">交易紀錄（點擊編輯）</div>`;
st.forEach(t=>{h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.ed={...S.tr.find(x=>x.id==='${t.id}')};initF(S.ed);set({v:'form'})"><div style="display:flex;align-items:center;gap:8px"><span class="badge ${t.action==="buy"?"buy-bg":"sell-bg"}">${t.action==="buy"?"買入":"賣出"}</span><span style="font-weight:700">@${ps}${f(t.price)}</span><span style="font-size:12px;color:#7b8da4">×${H(t.qty+un)}</span></div><span style="font-size:13px;color:#7b8da4">${t.date}</span></div>`});
// Delete position button
h+=`<div style="margin-top:24px"><button class="bd" onclick="set({modal:{type:'delpos',sym:'${S.det}'}})">🗑 刪除此持倉（${S.det}）的所有交易</button></div>`;
h+=`</div></div>`;
// Delete position modal
if(S.modal?.type===“delpos”)h+=`<div class="modal" onclick="if(event.target===this)set({modal:null})"><div class="cd" style="padding:24px;max-width:360px"><div style="font-weight:600;margin-bottom:8px">確認刪除 ${S.modal.sym}？</div><div style="font-size:13px;color:#7b8da4;margin-bottom:16px">將刪除此標的的所有交易紀錄，此操作無法復原</div><div style="display:flex;gap:10px"><button class="bs" onclick="set({modal:null})">取消</button><button class="bd" onclick="deletePosition('${S.modal.sym}')">確認刪除</button></div></div></div>`;
fin(h);return;
}

// ── FORM ──
if(S.v===“form”){
if(S.ed&&!F.id)initF(S.ed);const tw=F.cur===“TWD”,ps=tw?“NT$”:”$”;
h+=`<div class="hdr"><span style="font-weight:700;font-size:17px">${S.ed?"編輯交易":"新增交易"}</span></div><div class="scr"><div class="cnt"><div class="cd" style="padding:20px 18px">`;
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">市場</div><div style="display:flex;gap:8px;margin-bottom:14px"><button class="tg ${F.cur==="USD"?"on":""}" onclick="setFCur('USD')">🇺🇸 美股</button><button class="tg ${F.cur==="TWD"?"tw":""}" onclick="setFCur('TWD')">🇹🇼 台股</button></div>`;
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">操作</div><div style="display:flex;gap:8px;margin-bottom:14px"><button class="tg ${F.action==="buy"?"on":""}" onclick="setFAct('buy')">買入</button><button class="tg ${F.action==="sell"?"sell":""}" onclick="setFAct('sell')">賣出</button></div>`;
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">${tw?"股票代號":"代號"}</div><input class="inp" id="f_s" value="${esc(F.symbol)}" oninput="updTot()" placeholder="${tw?"2330":"TSLA"}" style="margin-bottom:14px">`;
h+=`<div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">每股價格 (${ps})</div><input class="inp" id="f_p" type="number" step="any" value="${F.price}" oninput="updTot()" placeholder="0"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">${tw?"張數":"數量"}</div><input class="inp" id="f_q" type="number" step="any" value="${F.qty}" oninput="updTot()" placeholder="0"></div></div>`;
if(tw)h+=`<div style="font-size:12px;color:#fbbf24;margin-bottom:8px">💡 1張=1000股，總成本 = 股價 × 張數 × 1000</div>`;
const tot=(+F.price||0)*(+F.qty||0)*(tw?1000:1);
h+=`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1e2d45;margin-bottom:14px"><span style="color:#7b8da4">總金額</span><span id="ftot" style="color:#00ddb8;font-size:20px;font-weight:700">${ps}${tw?fmTW(tot):fm(tot)}</span></div>`;
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:6px">日期</div><input class="inp" id="f_d" type="date" value="${F.date}" style="margin-bottom:14px">`;
const ok=F.symbol&&F.price&&F.qty&&+F.price>0&&+F.qty>0;
h+=`<div style="display:flex;gap:10px;margin-top:10px"><button class="bs" onclick="S.ed=null;initF();set({v:'home'})">取消</button><button class="bp" id="sbtn" onclick="submitF()" ${ok?"":"disabled"}>${S.ed?"更新":"儲存"}</button></div>`;
h+=`</div></div></div>`;h+=nav(“form”);fin(h);return;
}

// ── HEADER ──
h+=`<div class="hdr"><div style="display:flex;align-items:center;gap:8px"><span style="color:#00ddb8;font-size:20px">◇</span><span style="font-weight:700;font-size:17px">Portfolio</span></div><div style="display:flex;align-items:center;gap:4px">`;
h+=`<button class="hb" onclick="toggleHide()">${S.hide?"👁":"🙈"}</button>`;
h+=`<button class="ccb" onclick="S.cur=S.cur==='USD'?'TWD':'USD';sv(CK,S.cur);render()">${S.cur==="USD"?"$":"NT$"}</button>`;
h+=`<button class="rfb" onclick="fetchPrices(false)">${S.pLoading?"⏳":"🔄"}</button>`;
h+=`<button class="sb" onclick="cloudLoad()">${S.syncing?"⏳":"☁️"}</button>`;
h+=`</div></div>`;
h+=`<div class="pst">`;
if(S.lastUp)h+=`<span class="dot"></span>${S.pLoading?"更新中...":"更新於 "+timeAgo(S.lastUp)}`;
h+=`<span class="sdot" style="background:${S.synced?"#00ddb8":"#fbbf24"}"></span><span>${S.syncing?"同步中...":S.synced?"已同步 ☁️":"本機"}</span>`;
if(S.rate)h+=`<span>· 1 USD = ${fm(S.rate)} TWD</span>`;
h+=`</div>`;
h+=`<div class="scr"><div class="cnt">`;

if(S.v===“home”){
if(!S.tr.length){
h+=`<div style="text-align:center;padding:60px 20px"><div style="font-size:48px;margin-bottom:16px">📊</div><div style="font-weight:600;font-size:20px;margin-bottom:8px">開始追蹤投資</div><div style="color:#7b8da4;font-size:14px;margin-bottom:24px">支援美股+台股 · 雲端自動同步</div></div>`;
} else {
let tMV=0,tU=0,tRP=0,tTC=0;
pf.op.forEach(x=>{const p=gp(x.s),tw=x.cur===“TWD”;const mv=p?p*x.q*(tw?1000:1):x.c;tMV+=toDisp(mv,x.cur);tU+=p?toDisp((p*(tw?1000:1)-x.avg)*x.q,x.cur):0;tTC+=toDisp(x.c,x.cur)});
pf.cl.forEach(c=>tRP+=toDisp(c.pnl,c.cur));
const D=ds();
h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">`;
h+=sc(“持倉市值”,H(D+dfm(tMV)),”#5b9cf5”)+sc(“未實現盈虧”,H((tU>=0?”+”:”-”)+D+dfm(Math.abs(tU))),tU>=0?”#00ddb8”:”#f44”);
h+=sc(“已實現盈虧”,H((tRP>=0?”+”:”-”)+D+dfm(Math.abs(tRP))),tRP>=0?”#00ddb8”:”#f44”)+sc(“持倉成本”,H(D+dfm(tTC)),”#a48bf5”);
h+=`</div><div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">持倉（點擊查看詳情）</div>`;
pf.op.forEach(x=>{const p=gp(x.s),tw=x.cur===“TWD”,ps=tw?“NT$”:”$”,f=tw?fmTW:fm;
const avgPS=tw?x.avg/1000:x.avg; // avg per share
const mV=p?p*x.q*(tw?1000:1):null;
const u=p?(p*(tw?1000:1)-x.avg)*x.q:null;
const rt=p?((p*(tw?1000:1)-x.avg)/x.avg)*100:null;
const pc=u!=null?(u>=0?”#00ddb8”:”#f44”):”#7b8da4”;
const cpStr=p?`<span style="color:#5b9cf5;font-size:11px;margin-left:4px">📍${ps}${f(p)}</span>`:””;
h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="S.det='${x.s}';S.pv='';set({v:'det'})"><div style="display:flex;align-items:center;gap:10px">${tw?'<div style="width:26px;height:26px;border-radius:7px;background:rgba(251,191,36,.12);display:flex;align-items:center;justify-content:center;font-size:11px">🇹🇼</div>':""}<div><div style="font-weight:700;font-size:15px">${x.s}</div><div style="font-size:12px;color:#7b8da4;margin-top:2px">${H(x.q+(tw?" 張":" 股"))} · 均價 ${ps}${f(avgPS)}${cpStr}</div></div></div><div style="text-align:right"><div style="font-weight:700;color:${pc}">${H(mV!=null?ps+f(mV):ps+f(x.c))}</div><div style="font-size:12px;color:${pc}">${H(rt!=null?(rt>=0?"+":"")+fm(rt)+"%":"輸入報價 ›")}</div></div></div>`;
});
if(pf.cl.length){h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin:20px 0 12px">已平倉</div>`;
pf.cl.forEach(c=>{const g=c.pnl>=0,cl=g?”#00ddb8”:”#f44”,tw=c.cur===“TWD”,ps=tw?“NT$”:”$”,f=tw?fmTW:fm;
h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">${c.s}${tw?' <span class="badge tw-bg">台</span>':""}</div><div style="font-size:12px;color:#7b8da4">賣出 ${H(c.qty+"")} @ ${ps}${f(c.price)} · ${c.date}</div></div><div style="text-align:right"><div style="font-weight:700;color:${cl}">${H((g?"+":"-")+ps+f(Math.abs(c.pnl)))}</div>${c.cb>0?`<div style="font-size:12px;color:${cl}">${H((c.pnl/c.cb*100>=0?”+”:””)+fm(c.pnl/c.cb*100)+”%”)}</div>`:""}</div></div>`})}
}
} else {
h+=`<div style="font-size:13px;font-weight:600;color:#7b8da4;margin-bottom:12px">交易紀錄 (${S.tr.length})</div>`;
[…S.tr].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(t=>{const buy=t.action===“buy”,tw=t.cur===“TWD”,ps=tw?“NT$”:”$”,f=tw?fmTW:fm;
h+=`<div class="cd" style="display:flex;align-items:center;gap:10px"><div style="width:3px;height:32px;border-radius:2px;background:${buy?"#00ddb8":"#f44"}"></div><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:2px"><span class="badge ${buy?"buy-bg":"sell-bg"}">${buy?"買入":"賣出"}</span>${tw?'<span class="badge tw-bg">台</span>':""}<span style="font-weight:700">${t.symbol}</span><span style="color:#7b8da4;font-size:13px">@${ps}${f(t.price)}</span></div><div style="font-size:12px;color:#7b8da4">${H(t.qty+(tw?" 張":" 股"))} · ${H(ps+f(t.qty*t.price*(tw?1000:1)))} · ${t.date}</div></div><button onclick="S.ed={...S.tr.find(x=>x.id==='${t.id}')};initF(S.ed);set({v:'form'})" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">✏️</button><button onclick="set({del:S.tr.find(x=>x.id==='${t.id}')})" style="background:0;border:0;color:#7b8da4;cursor:pointer;font-size:14px">🗑</button></div>`});
}
h+=`</div></div>`;h+=nav(S.v);
if(S.toast)h+=`<div class="toast">${S.toast}</div>`;
if(S.del)h+=`<div class="modal" onclick="if(event.target===this)set({del:null})"><div class="cd" style="padding:24px;max-width:360px"><div style="font-weight:600;margin-bottom:12px">刪除此交易？</div><div style="display:flex;gap:10px"><button class="bs" onclick="set({del:null})">取消</button><button class="bd" onclick="S.tr=S.tr.filter(x=>x.id!==S.del.id);S.del=null;saveAll();toast('已刪除');render()">刪除</button></div></div></div>`;
fin(h);
}
function fin(h){document.getElementById(“app”).innerHTML=h}
function nav(v){return`<div class="nav"><button class="nb ${v==="home"?"on":""}" onclick="S.ed=null;initF();set({v:'home'})"><span style="font-size:18px">💼</span>總覽</button><button class="fab" onclick="S.ed=null;initF();set({v:'form'})">+</button><button class="nb ${v==="trades"?"on":""}" onclick="S.ed=null;initF();set({v:'trades'})"><span style="font-size:18px">📋</span>交易</button></div>`}
function sc(l,v,c){return`<div class="cd" style="border-left:3px solid ${c}"><div style="font-size:12px;color:#7b8da4;margin-bottom:6px">${l}</div><div style="font-size:18px;font-weight:700;color:${c}">${v}</div></div>`}
function sr(l,v,c){return`<div class="sr"><span style="font-size:14px;color:#7b8da4">${l}</span><span style="font-weight:600;font-size:15px;color:${c}">${v}</span></div>`}
function timeAgo(d){const m=Math.round((Date.now()-d.getTime())/6e4);return m<1?“剛剛”:m<60?m+“分鐘前”:Math.floor(m/60)+“小時前”}
render();cloudLoad();setTimeout(()=>fetchPrices(true),2000);setInterval(()=>fetchPrices(true),30*60*1000);
</script>

</body>
</html>
