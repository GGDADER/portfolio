name: 投資紀錄開發測試
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "tests/**", ".github/workflows/portfolio-tests.yml"]
  pull_request:
    paths: ["index.html", "tests/**", ".github/workflows/portfolio-tests.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            size: 390x844
          - browser: chromium
            size: 375x667
          - browser: chromium
            size: 1280x800
    name: ${{ matrix.browser }} · ${{ matrix.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/test_gas_compat.mjs
      - run: python -m unittest discover -s tests -v
        env:
          BROWSER: ${{ matrix.browser }}
          VIEWPORT: ${{ matrix.size }}
